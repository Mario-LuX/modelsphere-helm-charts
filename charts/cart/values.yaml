image:
  # Public images on Docker Hub. Override this (and the two sidecars below) to
  # pull from your own registry -- worth doing if your cluster has no egress.
  repository: 4pdosc/cache_aware_router
  tag: ""              # empty falls back to Chart.appVersion
  pullPolicy: IfNotPresent

replicas: 2                # master/standby: two replicas, only the leader takes traffic (see ha below)

# Adds an initContainer that waits for real workers to appear in config.yaml
# before CART starts. CART refuses to start with an empty worker list and exits,
# which under a Deployment means CrashLoopBackOff until the list is filled in.
# With this on, the pod sits in Init -- visibly waiting on a dependency rather
# than looking broken -- and then starts once, cleanly. It gives up after ~10
# minutes and starts anyway. Set false if you write workers into baseConfig
# yourself, in which case the check passes immediately regardless.
waitForWorkers: true

# Leader election through the ha-gate sidecar: only the leader passes readiness,
# so only the leader is in the Service's endpoints. CART's radix cache is local
# to a process, so an active/active pair would split it in half and halve the
# hit rate; one active replica keeps a single warm cache.
ha:
  enabled: true
  # This sidecar is built from the autoconfig project, not from CART, so its
  # version tracks autoconfig's releases rather than this chart's appVersion.
  # It is a regular container in the pod, not an init container: if the image
  # cannot be pulled, the whole pod stays down. Override it alongside the others
  # when pulling from your own registry.
  image: 4pdosc/autoconfig-hagate:0.3.31
  port: 8081
  appTcp: "127.0.0.1:8071"

probes:
  enabled: true       # one switch for startup + liveness + readiness (a Helm convention, not k8s syntax)

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Name of the ConfigMap holding CART's configuration. Empty means
# <fullname>-config, which is unique per release, so several CARTs can share a
# namespace without colliding. One CART serves exactly one model, so this
# ConfigMap is per-model too.
configMapName: ""

# The base config.yaml. Tune per-model settings (port, cache thresholds, ...)
# here. In a standalone install, write the worker list in as well; when a
# controller manages the workers it writes them into an overlay key instead
# (see configOverlays).
baseConfig: |
  server:
    host: "0.0.0.0"
    port: 8071
  cache:
    threshold: 0.1
    balance_abs_threshold: 10
    max_tree_size: 5000000
    daily_cleanup_hour_utc: 21
  proxy:
    add_routed_peer_header: true
    remote_media_url_policy: 400
    # Largest request body CART will accept, in bytes (200 MiB). Its own default
    # is 10 MiB, which rejects a multimodal request carrying inline image or
    # video data -- a single base64-encoded clip passes that on its own.
    max_body_size: 209715200
  health:
    endpoint: "/health"
    interval_secs: 10

# Extra keys in the same ConfigMap, appended after the base in the order listed
# and passed to CART as further `-c` files. Later files win: mappings merge key
# by key, lists and scalars are replaced wholesale, and an empty file changes
# nothing.
#
# At most one entry may be marked `autoconfig: true`. The chart does not render
# that key's content, so `helm upgrade` has nothing to write there and cannot
# clobber what the controller put in it. Leave the list empty and the controller
# rewrites the base document directly instead.
configOverlays: []
#   - key: workers.yaml     # written by the controller on its first reconcile
#     autoconfig: true
#   - key: tuning.yaml      # managed by this chart
#     content: |
#       cache:
#         threshold: 0.3

# CART's entrypoint refuses to start below this -- a router holding thousands of
# concurrent streams runs out of file descriptors long before it runs out of CPU.
ulimitNofile: 65535

reload:
  enabled: true
  # As with ha.image: built from autoconfig, versioned with it. Watches the
  # mounted ConfigMap and sends SIGHUP to CART when it changes.
  image: 4pdosc/autoconfig-reload:0.3.31
  process: "cache-aware-router"

service:
  type: ClusterIP
  port: 8071           # must match the port in baseConfig above

# The memory limit is what the radix tree is allowed to grow into: it holds the
# prompt prefixes of every request seen since the last daily cleanup, so it
# tracks traffic rather than model size, and max_tree_size above caps the node
# count, not the bytes. Keep it generous -- hitting the limit means the OOM
# killer takes the leader, and the warm cache goes with it.
resources:
  requests: { cpu: 200m, memory: 256Mi }
  limits: { cpu: "4", memory: 32Gi }

podAnnotations: {}
nodeSelector: {}
tolerations: []
# Anything set here ADDS to the podAntiAffinity that ha.enabled installs (which
# keeps the two replicas off one node) rather than replacing it. Write your own
# podAntiAffinity to override that one.
affinity: {}
nameOverride: ""
fullnameOverride: ""

# The one hard cutoff: at this point the kubelet sends SIGKILL and any request
# still in flight dies. CART forwards SSE streams that can run for many minutes
# (a 64K-token completion is not unusual), so this has to be set to the longest
# response you expect. The Kubernetes default of 30s will cut them: a graceful
# drain cannot hold a connection open past the grace period.
terminationGracePeriodSeconds: 3600
