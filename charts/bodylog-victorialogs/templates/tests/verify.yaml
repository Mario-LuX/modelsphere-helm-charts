apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bodylog-victorialogs.fullname" . }}-verify
  namespace: {{ .Release.Namespace }}
  labels: {{- include "bodylog-victorialogs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: verify
      image: "{{ .Values.test.image.repository }}:{{ .Values.test.image.tag }}"
      env:
        - { name: VL, value: {{ include "bodylog-victorialogs.vlUrl" . | quote }} }
        - { name: WITHIN, value: {{ .Values.test.expectRecordsWithin | quote }} }
        - { name: READY_TIMEOUT, value: {{ .Values.test.readyTimeoutSeconds | quote }} }
      command:
        - sh
        - -c
        - |
          set -u
          fail() { echo "FAIL: $*"; exit 1; }
          # The same URL Vector ships to and Grafana reads from.
          #
          # Waited for rather than asked once: an installer that does not wait
          # for the release's pods -- helm without --wait, or helmfile, whose
          # helmDefaults.wait is off -- runs this while VictoriaLogs is still
          # ContainerCreating, and one attempt fails a healthy install. The
          # deadline keeps it a test: a VictoriaLogs that is down still fails.
          deadline=$(( $(date +%s) + READY_TIMEOUT ))
          while :; do
            h=$(curl -sS --max-time 10 "$VL/health" 2>&1) && [ "$h" = "OK" ] && break
            [ "$(date +%s)" -lt "$deadline" ] \
              || fail "$VL did not answer OK within ${READY_TIMEOUT}s (last answer: ${h:-<none>})"
            sleep 5
          done
          echo "ok    $VL/health"
          q() { curl -sS --fail --max-time 30 "$VL/select/logsql/query" --data-urlencode "query=$1"; }
          all=$(q '* | stats count() n') || fail "query API error"
          echo "ok    query API: $all"
          if [ -n "$WITHIN" ]; then
            # Three outcomes, three messages. Piping the query straight into sed
            # would lose its exit status and report an API error, or a count this
            # parser could not read, as "no records" -- blaming Vector for a
            # failure on the VictoriaLogs side.
            out=$(q "_time:$WITHIN | stats count() n") || fail "query API error on _time:$WITHIN"
            n=$(printf '%s' "$out" | sed -n 's/.*"n":"\{0,1\}\([0-9]\{1,\}\)"\{0,1\}.*/\1/p')
            [ -n "$n" ] || fail "no count in the answer to _time:$WITHIN -- got: $out"
            [ "$n" -gt 0 ] || fail "0 records in the last $WITHIN -- is Vector shipping?"
            echo "ok    $n records in the last $WITHIN"
          fi
