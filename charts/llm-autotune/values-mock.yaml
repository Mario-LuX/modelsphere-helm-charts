# AutoTune on its own, with a fake benchmark platform in place of LLMBench.
# Layer it on values-demo.yaml:
#
#   helm install autotune modelsphere/llm-autotune \
#     -f values-demo.yaml -f values-mock.yaml \
#     --set jwtSecret=$(openssl rand -hex 32) --set adminPassword=...
#
# The fake probes the deployed endpoint, so a broken engine still fails the
# run, then reports deterministic numbers instead of measuring anything. The
# demo (deploy/demo.sh) uses a real LLMBench instead; this is for
# working on AutoTune itself.
mock:
  enabled: true
