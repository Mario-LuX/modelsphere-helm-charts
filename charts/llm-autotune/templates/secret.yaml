{{- $fullName := include "llm-autotune.fullname" . -}}
{{- $pg := .Values.postgresql -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-secrets
  labels: {{- include "llm-autotune.labels" . | nindent 4 }}
type: Opaque
stringData:
  AUTOTUNE_JWT_SECRET: {{ required "jwtSecret is required: helm install --set jwtSecret=$(openssl rand -hex 32)" .Values.jwtSecret | quote }}
  AUTOTUNE_ADMIN_PASSWORD: {{ .Values.adminPassword | quote }}
  AUTOTUNE_LLMBENCH_API_KEY: {{ .Values.llmbench.apiKey | quote }}
  AUTOTUNE_LLMBENCH_PASSWORD: {{ .Values.llmbench.password | quote }}
  {{- if $pg.enabled }}
  POSTGRES_PASSWORD: {{ $pg.password | quote }}
  AUTOTUNE_DATABASE_URL: postgresql+asyncpg://{{ $pg.user }}:{{ $pg.password }}@{{ $fullName }}-postgresql:5432/{{ $pg.database }}
  AUTOTUNE_SYNC_DATABASE_URL: postgresql+psycopg2://{{ $pg.user }}:{{ $pg.password }}@{{ $fullName }}-postgresql:5432/{{ $pg.database }}
  {{- else }}
  AUTOTUNE_DATABASE_URL: {{ required "externalDatabase.asyncUrl is required when postgresql.enabled=false" .Values.externalDatabase.asyncUrl | quote }}
  AUTOTUNE_SYNC_DATABASE_URL: {{ required "externalDatabase.syncUrl is required when postgresql.enabled=false" .Values.externalDatabase.syncUrl | quote }}
  {{- end }}
