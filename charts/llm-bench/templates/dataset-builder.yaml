{{- if .Values.datasetBuilder.enabled }}
{{- if not .Values.datasets.enabled }}
{{- fail "datasetBuilder.enabled requires datasets.enabled: the collector publishes onto the shared datasets volume that the workers read." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-bench.fullname" . }}-dataset-builder
  labels:
    {{- include "llm-bench.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataset-builder
spec:
  # ONE collector, and never two at once. Recreate (not RollingUpdate) because
  # two collectors would briefly share the datasets volume and could publish
  # competing builds of the same profile. The DB claim + heartbeat in
  # app/datasets/service.py is the backstop for the overlap this still can't
  # rule out (a rescheduled pod, an operator running the dry-run CLI).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llm-bench.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dataset-builder
  template:
    metadata:
      labels:
        {{- include "llm-bench.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dataset-builder
      annotations:
        # The settings arrive through envFrom: a changed value must restart
        # the pods that read it, or they keep the old one until something
        # else restarts them.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      # A build in flight is abandoned on SIGTERM, not published — the staged
      # file is discarded and the previous build keeps serving. So this only
      # needs to cover an orderly stop, not a whole collection.
      terminationGracePeriodSeconds: {{ .Values.datasetBuilder.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "llm-bench.serviceAccountName" . }}
      containers:
        - name: dataset-builder
          image: {{ include "llm-bench.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["python", "-m", "app.datasets.service"]
          ports:
            - name: http
              containerPort: {{ .Values.datasetBuilder.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: {{ include "llm-bench.fullname" . }}
            - secretRef:
                name: {{ include "llm-bench.fullname" . }}
          env:
            - name: DATASET_BUILDER_PORT
              value: {{ .Values.datasetBuilder.port | quote }}
            # Where published datasets live. Must be on the datasets volume so
            # the workers can read what this pod writes, and so the staged file
            # and its final path share a filesystem (the publish is a rename).
            - name: REPLAY_FEED_ROOT
              value: {{ .Values.datasetBuilder.feedRoot | default (printf "%s/replay/auto" .Values.datasets.mountPath) | quote }}
            # The zone the bodylog listener names its hourly files in (its own
            # `timezone` value) — see app/datasets/sources.py.
            - name: REPLAY_FEED_FILE_TZ
              value: {{ .Values.datasetBuilder.bodylog.fileTimezone | default "UTC" | quote }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.datasetBuilder.logLevel }}
            - name: LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: datasets
              mountPath: {{ .Values.datasets.mountPath }}
            {{- if or .Values.datasetBuilder.bodylog.existingClaim .Values.datasetBuilder.bodylog.hostPath }}
            - name: bodylog
              mountPath: {{ .Values.datasetBuilder.bodylog.mountPath }}
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.datasetBuilder.resources | nindent 12 }}
      volumes:
        - name: datasets
          persistentVolumeClaim:
            claimName: {{ include "llm-bench.fullname" . }}-datasets
        {{- with .Values.datasetBuilder.bodylog }}
        {{- if .existingClaim }}
        - name: bodylog
          persistentVolumeClaim:
            claimName: {{ .existingClaim }}
            readOnly: true
        {{- else if .hostPath }}
        - name: bodylog
          hostPath:
            path: {{ .hostPath }}
            type: Directory
        {{- end }}
        {{- end }}
      {{- with (.Values.datasetBuilder.bodylog.nodeSelector | default .Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-bench.fullname" . }}-dataset-builder
  labels:
    {{- include "llm-bench.labels" . | nindent 4 }}
    app.kubernetes.io/component: dataset-builder
spec:
  # ClusterIP only. The backend proxies admin "rebuild now" requests here; the
  # collector is never exposed outside the cluster.
  type: ClusterIP
  ports:
    - port: {{ .Values.datasetBuilder.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "llm-bench.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dataset-builder
{{- end }}
