apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm-bench.fullname" . }}-backend
  labels:
    {{- include "llm-bench.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "llm-bench.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
