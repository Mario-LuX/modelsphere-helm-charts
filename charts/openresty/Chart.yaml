apiVersion: v2
name: openresty
description: "Session-affinity router for LLM inference backends: pins a conversation to the backend that already holds its prefix cache, with active health checking, adaptive concurrency and full body logging"
home: https://github.com/modelsphere/helm-charts
sources:
  - https://github.com/modelsphere/helm-charts
  - https://github.com/modelsphere/llm-openresty
type: application
# The chart version tracks appVersion for this chart, so the chart and the image
# it ships share one number. Not a rule for every chart here: cart carries a
# chart version of its own, independent of the app it ships.
version: 0.1.21
# The router image tag: values.image.tag is empty by default and falls back to
# this, so a release moves both together.
#
# 0.1.20 is the current release: it is the newest openresty/v* tag upstream, the
# version ChartMuseum serves, and the image published as
# 4pdosc/llm-openresty:0.1.20. This said 0.1.19 because that was the newest
# release when the chart was written, before 0.1.20 was cut.
appVersion: "0.1.20"
keywords: [openresty, routing, session-affinity, autoconfig]
