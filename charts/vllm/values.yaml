# Names every resource this chart owns. Empty means the release name, unadorned.
#
# Set it ONLY to keep an existing release's engine Deployment where it is: before
# the resource names were simplified it was <release>-vllm, and renaming a live
# Deployment is a delete-and-create, not a rolling update -- on a GPU node the
# replacement cannot schedule until the old pod releases its GPU, so the upgrade
# costs the grace period plus a cold model load. Pinning
#
#   fullnameOverride: <release>-vllm
#
# makes that upgrade ordinary. It does not restore the older Service
# (<release>-vllm-svc) or LLMScaler (<release>-scaler), whose suffixes differed --
# one value cannot be three names. Both are recreated either way, costing a new
# ClusterIP and an operator re-adopt but no pod restart.
#
# The metrics mock and the CART subchart keep their own names and ignore this.
# Under lws.enabled the engine Service is <fullnameOverride>-leader, since the
# LWS controller already owns a headless Service named after the LWS.
fullnameOverride: ""

# The id this service is known by OUTSIDE the cluster's object graph: the one
# string the decision server, the SLO operator and the route all index it under.
# Not a Kubernetes name, and never looked up from an object.
#
# Empty means vllm.fullname. It supplies the default for
# scaler.customProvider.serviceId, sloRequirement.serviceId, sloRequirement.name,
# modelRoute.slo.name and modelRoute.monitor.model -- each of which can still be
# set on its own.
serviceId: ""

# Only used when scaler.enabled is false. With the scaler on, the chart omits
# spec.replicas entirely so the operator can own it (see deployment.yaml), and
# the starting count comes from scaler.minReplicas instead.
replicaCount: 1

# Multi-node: one model instance spread across several nodes, as a
# LeaderWorkerSet (leaderworkerset.x-k8s.io/v1) instead of a Deployment. The
# GROUP (lws.size pods: one leader + workers) is the unit that loads the model,
# scales and restarts. Requires the LWS controller.
#
# vLLM's own multi-node mode, no Ray: the leader runs `vllm serve` with the API
# server, every worker runs `vllm serve --headless` (GPU workers only), and the
# multiprocessing executor spans the nodes. --nnodes, --node-rank,
# --master-addr, --master-port, --distributed-executor-backend=mp and
# --headless are derived from the group; the parallelism layout goes in
# extraArgs, and must add up: tensor-parallel-size x pipeline-parallel-size =
# lws.size x model.gpus (model.gpus is per POD).
#
# The rest of the chart carries over: the Service narrows to role: leader and is
# renamed <fullname>-leader (the LWS controller owns a headless Service called
# <fullname>), scaler.targetRef follows to the LWS where one replica is a whole
# group, ModelRoute / CART / ServiceMonitor are unchanged.
#
# STARTUP of one group
#   1. leader pod created                     [startupPolicy]
#   2. worker pods created, in parallel
#   3. every pod runs model-check             [modelCheck]
#   4. workers block on the leader's port     [waitForLeader, distPort]
#   5. ranks rendezvous, load weights, form the NCCL group
#   6. leader binds service.port -> the group is serving
#
# SHUTDOWN of one group (scale-down, rolling update, or any member restarting
# under RecreateGroupOnPodRestart). The two grace periods run in SERIES:
#   1. leader pod deleted FIRST               [terminationGracePeriodSeconds]
#      a. endpoint removed from the Service
#      b. preStop drains until idle           [endpointSyncSeconds, drainSeconds]
#         (gives up early if /metrics stays unreadable: nothing to drain)
#      c. preStop SIGTERMs PID 1, waits, kills its children if it is stuck
#                                             [leaderPreStopKill / preStopKill,
#                                              shutdownTimeout + shutdownReserveSeconds]
#      d. kubelet SIGKILL at the grace deadline -- backstop
#   2. worker StatefulSet GC'd (its owner is the leader POD)
#   3. worker pods                            [workerTerminationGracePeriodSeconds]
#   4. replacement group starts -- same pod names, so only now
#
# Things that bite, none of them visible from the field names:
#   - LeaderCreated promises the leader POD exists, not that anything is
#     listening. LeaderReady would deadlock: the API port binds only once the
#     workers have joined.
#   - Workers carry no probes. READY 1/1 means "container running", not "model
#     loaded" -- the group's real readiness is the leader's.
#   - SIGKILL to PID 1 from inside its own PID namespace is silently dropped
#     (kill(2) still returns 0). SIGTERM gets through because vLLM installs a
#     handler, and PID 1's children are killable -- which is what (1c) uses.
#   - A process wedged in the GPU driver (D state) ignores even the kubelet's
#     SIGKILL: the pod sits in Terminating holding its GPUs until the node is
#     dealt with. No chart setting reaches that.
lws:
  enabled: false
  size: 2                                   # pods per group, leader included = --nnodes
  replicas: 1                               # GROUPS, not pods; omitted when the scaler owns it
  distPort: 29500                           # --master-port: rendezvous, pod-to-pod inside the group
  startupPolicy: LeaderCreated
  restartPolicy: RecreateGroupOnPodRestart
  subdomainPolicy: Shared                   # Shared | UniquePerReplica
  waitForLeader: true
  workerTerminationGracePeriodSeconds: 60   # empty = same as the leader's; 0 = SIGKILL at once
  leaderPreStopKill: true
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxSurge: 1
      maxUnavailable: 0

image:
  repository: "vllm/vllm-openai"
  tag: "latest-cu129-ubuntu2404"

model:
  # The Hugging Face repo ID
  name: "facebook/opt-125m"
  # Where the models are cached on the host node. Empty means no model volume at
  # all -- no hostPath, no mount -- which only makes sense under commandOverride
  # below, since vLLM cannot start without --model.
  localPath: "/mnt/disk0/models/facebook/opt-125m"
  # Where localPath is mounted inside the container. Feeds both the volumeMount
  # and --model, so the two cannot drift apart.
  mountPath: "/models"
  # `Directory` makes the kubelet refuse to start the pod when localPath does not
  # exist on the node, surfacing a FailedMount event immediately.
  # `DirectoryOrCreate` would instead create an empty directory and hand it to
  # the engine, which then fails minutes later with an error pointing at the
  # model rather than at the mount.
  hostPathType: Directory
  # Rendered as --max-model-len. Empty (the default) omits it, so vLLM uses the
  # model's own. Only set it when you really mean to cap the context. Same key
  # as the sglang chart; the old name model.maxLen is still read.
  contextLength: ""
  # Empty or "0" leaves nvidia.com/gpu off the pod entirely rather than
  # requesting zero of it: the two schedule alike, but device plugins, GPU
  # webhooks and quota all key off the key being there.
  gpus: "1"

# Init container that checks the mounted model directory before the engine gets
# a chance to start. hostPathType: Directory already catches a missing path; this
# catches the cases it cannot see -- an empty directory, or a half-synced one
# where the weights never finished copying. Failing here costs seconds and says
# exactly what is wrong, instead of a multi-minute load ending in a stack trace.
#
# It reuses the engine image, so nothing extra has to be pulled or mirrored into
# a private registry, and it needs no GPU.
modelCheck:
  enabled: true
  # Each glob must match at least one entry directly under model.mountPath.
  # Empty the list to only assert the directory is non-empty.
  requiredGlobs:
    - "config.json"

# Extra vLLM server flags, appended verbatim to the command line (e.g.
# --tensor-parallel-size=2). The chart already emits --model,
# --served-model-name, --host, --port and --shutdown-timeout, so do not repeat
# those here.
#
# Under lws.enabled this is also where the parallelism layout goes
# (--tensor-parallel-size / --pipeline-parallel-size); the flags the group
# derives (--nnodes, --node-rank, --master-addr, --master-port, --headless,
# --distributed-executor-backend) are rejected here.
#
# Rejected under commandOverride below, which leaves no command line to append to.
extraArgs: []

# The container's command, replacing the vLLM line the chart builds. Unset
# (default) leaves that alone; defined takes it over completely -- no --model, no
# --shutdown-timeout, and extraArgs is rejected. `[]` means the image's own
# ENTRYPOINT.
#
# For running something that is not vLLM -- a mock server on service.port, to
# exercise routing and scaling without GPUs or weights -- pair it with an empty
# model.localPath and model.gpus, and turn modelCheck off.
#
# Use a values file for the `[]` form: `--set commandOverride={}` yields [""],
# which no container can exec.
commandOverride:

service:
  type: ClusterIP
  # The inference and /metrics port. Threaded through the container port, the
  # Service, the probes, vLLM's --port flag and the preStop drain URL, so
  # changing it here is enough.
  port: 8000

# Probes. `port: http` refers to the container port by name, so it follows
# service.port automatically.
#
# The startupProbe is what makes a livenessProbe safe here: until it succeeds
# the kubelet does not run liveness or readiness at all, so loading a large
# model cannot be mistaken for a hang and restarted. Its
# failureThreshold x periodSeconds is the whole startup budget -- raise
# failureThreshold for big models (a 30B+ model can need 10-20 minutes). Until
# vLLM finishes engine init the port is not answering at all, so the probe fails
# by connection refusal, which is exactly what the budget is for.
# Always set timeoutSeconds. It defaults to 1 second, which is too tight for a
# server that is busy loading weights.
startupProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 180         # 180 x 30s = 90 minutes to load
readinessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
# /health is a fair liveness target here, unlike in the sglang chart: vLLM's
# handler calls engine_client.check_health(), so it fails when the engine core
# dies rather than only when the HTTP process does. No deeper endpoint needed.
livenessProbe:
  httpGet:
    path: /health
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  # Deliberately slack: a busy server answering /health slowly should not be
  # restarted. Only a genuinely wedged process should fail this many times.
  failureThreshold: 6

# Hang-detection sidecar: reads this pod's vLLM /metrics, serves /healthz
# (200/503), and takes over the engine's livenessProbe (503 -> kubelet restarts
# the engine). Reports only -- no k8s API / RBAC. Deeper than /health: watches
# token_progress stalling, which a wedged scheduler (CUDA/NCCL) still hides from
# /health. vLLM exposes /metrics by default. startupProbe still gates model load.
hangWatcher:
  enabled: true              # default on; false = fall back to the engine's own livenessProbe, drop the sidecar (e.g. image unreachable)
  image:
    repository: "4pdosc/hang-watcher"
    # 0.1.22 or newer is a hard requirement: both stallSec and the livenessProbe
    # below assume it. That version adds the vllm:kv_cache_usage_perc signal,
    # which covers the prefill blind spot, and probes on every stalled poll, so
    # declaring a hang takes consecutive failures rather than one slow probe.
    # On anything older, raise stallSec until it covers your longest prefill.
    tag: "0.1.22"
  port: 9090                 # /healthz port (just needs to differ from service.port)
  # Thresholds -> ConfigMap the sidecar hot-reloads (helm upgrade retunes, no pod restart).
  config:
    # Detection is late by 0..pollIntervalSec: once stallSec is reached, the
    # sidecar still waits for the next poll.
    pollIntervalSec: 5
    # How long token_progress may stay frozen before the sidecar gets suspicious.
    # The sglang chart uses the same value.
    #
    # vLLM advances generation_tokens_total step by step during decode, so it has
    # none of sglang's "only counts when a request finishes" blind spot. During
    # prefill, though, all three counters freeze; that window is covered by the
    # sidecar's vllm:kv_cache_usage_perc signal (see image.tag). Running an older
    # sidecar with very long contexts and low concurrency, raise this until it
    # covers the longest single prefill.
    stallSec: 30
    metricsTimeoutSec: 10
    # Active confirmation: once token_progress has frozen past stallSec, probe the engine --
    # 2xx = alive (no hang), timeout = confirmed hang. Default POST /v1/completions (real
    # inference path, catches a wedged scheduler that still answers /health,/v1/models);
    # empty body -> chart fills it from model.name.
    # Deliberately not sglang's GET /health_generate: vLLM has no bounded
    # equivalent. Its /health only calls check_health() and never reaches the
    # scheduler, so POST /v1/completions is the only probe that does.
    activeProbeEnabled: true
    activeProbePath: /v1/completions
    activeProbeMethod: POST
    activeProbeBody: ""
    # The probe is only sent once progress has already frozen, when the engine is
    # essentially idle and a max_tokens=1 request returns immediately. Under load
    # it can be far slower -- 92.6s was measured on a deployment combining long
    # prefills with high concurrency -- so measure your own before settling on a
    # value.
    #
    # One constraint the chart does NOT enforce at render time:
    #     activeProbeTimeoutSec + pollIntervalSec < stallSec / 3
    # Otherwise one or two failures are enough to push stalledFor to stallSec and
    # re-probing every poll buys nothing. The defaults here, 5 + 5 = 10 against
    # stallSec / 3 = 10, sit exactly on that boundary. Note the direction:
    # RAISING activeProbeTimeoutSec makes a false kill more likely, not less --
    # slower probes mean fewer of them fit in a stall window, which lowers the
    # consecutive-failure bar.
    activeProbeTimeoutSec: 5
  # This tunes the ENGINE container's livenessProbe, which points at this
  # sidecar's /healthz -- not the sidecar's own; the sidecar has no liveness
  # probe. The sglang chart uses the same values.
  #
  # It is coupled to the sidecar version: a 503 restarts the engine 10s later,
  # while the sidecar needs one poll plus one probe (5 + 5) to change its mind.
  # The two arrive together -- the reprieve and the execution. So with a sidecar
  # that probes only once when stallSec elapses, a single slow probe is enough to
  # kill a healthy engine. See image.tag.
  livenessProbe:
    periodSeconds: 5
    failureThreshold: 2
  # Readiness on the SIDECAR ITSELF: a pod is an endpoint only while every container is ready,
  # so a hang verdict drops it out of the Service without touching the engine's own probes.
  # More aggressive (2 x 5s) than liveness because a wrong readiness only moves traffic.
  # Startup is unaffected (healthy until the first scrape). Set to {} to drop it.
  readinessProbe:
    periodSeconds: 5
    failureThreshold: 2
  resources:
    requests: { cpu: "10m", memory: "16Mi" }
    limits:   { cpu: "100m", memory: "64Mi" }

# Graceful shutdown / cache-aware scale-down draining.
#
# A pod being deleted goes through two stages, and both come out of the same
# timer, which starts the moment the pod is marked Terminating:
#
#   1. preStop  -- up to endpointSyncSeconds + drainSeconds
#   2. SIGTERM  -- up to lifecycle.shutdownTimeout (vLLM finishing up)
#
# If the two together do not fit in terminationGracePeriodSeconds, the kubelet
# kills the pod partway through and any request still running dies with it. The
# chart checks this when it renders, so a bad combination fails `helm install`
# instead of quietly dropping requests later.
terminationGracePeriodSeconds: 3600
lifecycle:
  preStop:
    enabled: true
    # Stage 1a: keep serving while the cluster takes this pod out of the load
    # balancer (Cilium, kube-proxy, ...), so no new requests are sent here.
    #
    # This always waits the full time. Kubernetes starts removing the pod from
    # the load balancer and runs this hook AT THE SAME TIME, not one after the
    # other, and the pod has no way to check whether that removal finished yet.
    #
    # Set it to however long whatever routes traffic here needs to notice. Cilium
    # suggests ~1s for a ClusterIP Service and ~10s if an external load balancer
    # is in front; 5 is a safe middle default.
    endpointSyncSeconds: 5
    # Stage 1b: how long to wait, at most, for requests already accepted to
    # finish. The hook watches vLLM's own metrics and moves on as soon as the
    # server goes idle, so a quiet pod shuts down in about endpointSyncSeconds
    # instead of always waiting this long.
    drainSeconds: 600
    # How often to re-check whether vLLM has gone idle.
    pollIntervalSeconds: 5
  # Stage 2: how long in-flight requests get after SIGTERM lands.
  #
  # 0 means --shutdown-timeout is not passed, leaving vLLM's own behaviour:
  # SIGTERM aborts whatever is still running. That is what this chart wants, and
  # matches the sglang chart's forceShutdown: true -- draining happens only in
  # preStop, where it is bounded (capped by drainSeconds, returning early once
  # idle) and counted inside terminationGracePeriodSeconds.
  #
  # Set a positive value and it has to fit inside terminationGracePeriodSeconds
  # together with endpointSyncSeconds + drainSeconds; the chart checks that sum at
  # render time. Requires vLLM 0.18.0 or newer.
  shutdownTimeout: 0
  # Stage 3: time reserved for vLLM's own exit after SIGTERM (and after
  # shutdownTimeout, when set) -- headroom kept free in the grace period, and
  # the chart checks it fits. Under preStopKill / lws.leaderPreStopKill it is
  # also how long the hook waits, on top of shutdownTimeout, after its own
  # SIGTERM before deciding vLLM is wedged and killing PID 1's children.
  shutdownReserveSeconds: 20
  # Whether the preStop hook ends by killing vLLM itself: SIGTERM to PID 1, then
  # SIGKILL to its children after shutdownTimeout + shutdownReserveSeconds if it
  # is still up. Needs no cooperation from the engine -- which is the point for a
  # pod deleted mid-load, before vLLM has a SIGTERM handler to hear the kubelet.
  #
  # Applies to single-pod Deployments. The LWS path has its own switch,
  # lws.leaderPreStopKill, because there the kill additionally has to break a
  # collective whose workers are already gone.
  preStopKill: true

scaler:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  syncPeriodSeconds: 10

  # Where the scaling signal comes from. The two are alternatives, not layers,
  # and there is no fallback between them:
  #
  #   Prometheus  metrics below are PromQL, evaluated against serverAddress, and
  #               replicas come out of ceil(readyReplicas * value / target).
  #   Custom      metrics below are not read at all. serverAddress is a decision
  #               server, and the scaler reads a replica count straight off it.
  #               Requires customProvider.serviceId.
  #
  # Which one is in play also decides what serverAddress means, what has to be
  # filled in below, and whether scaleDown.deletionCostQuery is consulted.
  #
  # Custom by default, as in the sglang chart: the replica count comes from the
  # stack's decision server (decision-gen), which reads this release's
  # LLMSLORequirement below.
  metricProvider: Custom

  # The metric source endpoint. Under Prometheus it is the query API (the
  # /api/v1/query base) -- the default below is the headless Service the
  # Prometheus Operator creates, adjust it to your cluster, and note vLLM is
  # scraped into it via the serviceMonitor further down. Under Custom it is
  # instead the decision server's base URL, e.g. http://decisions:80.
  serverAddress: "http://decision-gen.llm-scaler.svc:80"
  # Optional HTTP headers sent with every fetch from serverAddress (e.g. auth for
  # a secured endpoint). Used verbatim. Empty for a typical in-cluster
  # Prometheus. Applies to both providers.
  serverHeaders: {}

  # Only read when metricProvider is Custom; ignored otherwise.
  customProvider:
    # serviceId override. Empty means the top-level serviceId.
    serviceId: ""
    # Request path on serverAddress. The CRD defaults it to /decisions; left
    # empty here so that default stands rather than being restated.
    path: ""
    # Narrows the match to decisions carrying this namespace, for a server that
    # reports the same serviceId in several -- a serviceId matching more than one
    # decision is an error rather than a choice.
    #
    # Empty (the default) means the RELEASE namespace, the one this deployment
    # actually runs in, so a duplicate id reported from elsewhere in the cluster
    # can never be the decision this scaler reads. Set it only when the server
    # files this service's decisions under some other namespace than the one it
    # is installed in; there is no way to ask for an unnarrowed match, because a
    # decision for another namespace is not this release's to follow.
    namespace: ""

  # Required (and non-empty) under the Prometheus provider; ignored entirely
  # under Custom, which gets its recommendation from the decision server.
  #
  # Each metric is a PromQL query (returning a single averaged value) plus a
  # per-replica target. Scaling compares them as
  # ceil(readyReplicas * value / target). Bake label filters into the query.
  # The __SCOPE__ token expands to namespace="<ns>", app="<release>-vllm", scoping
  # the query to THIS deployment's pods — important when several deployments (even
  # same-named releases in different namespaces) serve the same model.
  # A short avg_over_time window keeps the signal robust to a missed scrape and
  # filters single-sample spikes; keep it short (~1m) so scale-up stays fast —
  # scale-down conservatism belongs in scaleDown.stabilizationWindowSeconds.
  metrics:
    # Queue depth (requests waiting per replica). This is the signal that
    # actually moves under real load on a small model — its KV cache barely
    # fills, but requests queue once concurrency exceeds vLLM's max-num-seqs.
    # Scale up when the average waiting requests per replica exceeds target.
    - name: queue-depth
      query: 'avg(avg_over_time(vllm:num_requests_waiting{__SCOPE__}[1m]))'
      target: "5"
  # Cache-aware scale-down. deletionCostQuery is a PromQL instant query that
  # returns one series per pod (carrying a "pod" label); its value becomes that
  # pod's controller.kubernetes.io/pod-deletion-cost (lower = deleted first), so
  # colder pods should yield lower numbers. Evaluated against serverAddress at
  # scale-down time. Leave empty to use the built-in newest-pod-first heuristic.
  # Keep empty when metricsMock is enabled (the mock has no per-pod "pod" label).
  # Being PromQL, it is dropped under the Custom provider -- serverAddress is a
  # decision server with no query API there, so the heuristic is used regardless.
  scaleDown:
    behavior: CacheAware
    # Hold at the highest recommendation over this window before scaling down, so
    # a brief metric dip doesn't cause flapping (scale-up stays immediate).
    # 0 disables it (keeps the metricsMock demo snappy); set e.g. 300 in prod.
    stabilizationWindowSeconds: 10
    # Cap on how many replicas one scale-down step removes, so the fleet walks
    # down instead of bursting from N to minReplicas. 0 disables the cap (keeps
    # the metricsMock demo snappy); set e.g. 1 in prod.
    maxStepReplicas: 0
    deletionCostQuery: ""
    # Example (scoped to this deployment via __SCOPE__):
    #   deletionCostQuery: 'vllm:kv_cache_usage_perc{__SCOPE__} * 100'

# An LLMSLORequirement (inference.modelsphere.dev/v1alpha1) filed for this service: the
# latency targets the platform holds it to. modelRoute.slo below points openresty
# at this same object, so the route's limits come from it instead of the static
# ttft_limit_ms / tps_limit_tps.
#
# Requires the CRD, which ships with the inference operator.
sloRequirement:
  enabled: true
  # metadata.name of the CR. Empty means the top-level serviceId, which is also
  # what modelRoute.slo.name defaults to, so the route's reference resolves here.
  name: ""
  # spec.serviceId -- who the requirement is filed for. Empty means the top-level
  # serviceId.
  serviceId: ""
  annotations: {}
  # The rest of spec, passed through verbatim (latency targets and whatever else
  # the operator grows). Open by design: that schema belongs to the inference
  # operator, and a chart change per field would only lag it.
  extraSpec: {}
    # ttftMs: 20000
    # tpotMs: 100

# Deterministic scale-op simulation. When enabled, the scaler queries this mock
# instead of real Prometheus, so you can drive scaling by hand: set `value`
# above the target (e.g. 10 vs target 5) to scale toward maxReplicas, below it
# (e.g. 0) to scale toward minReplicas. Note: the value is static regardless
# of replica count, so it pegs to the min/max bound rather than settling.
metricsMock:
  enabled: false
  image: "hashicorp/http-echo:0.2.3"
  # The value the mock returns for the metric query (compared against target).
  value: "10"

serviceMonitor:
  # Requires the Prometheus Operator CRDs (monitoring.coreos.com) to be installed.
  enabled: true
  # vLLM exposes Prometheus metrics on the inference port at /metrics
  path: /metrics
  interval: 15s
  scrapeTimeout: 10s
  # Extra labels so the cluster's Prometheus serviceMonitorSelector picks it up,
  # e.g. { release: kube-prometheus-stack }
  labels:
    release: kube-prometheus-stack
  # Pod labels copied onto the scraped series. `app` lets metric queries scope to
  # a single deployment (app="<release>-vllm") when several serve the same model.
  podTargetLabels:
    - app

# The cache-aware router (CART) for THIS model, deployed as part of this release
# from the vendored subchart in charts/cart.
#
# Everything below `enabled` is the subchart's own values (charts/cart/values.yaml
# is the documented source of truth, comments included). The keys restated here
# are only the ones worth setting per model; leave them commented out to inherit
# the subchart default.
#
# This is the whole switch. With modelRoute.enabled, turning it on also routes
# through the CART -- nothing under modelRoute has to be set, or can be:
#   - the modelRoute.cart block is written from the CART deployed here
#   - a `- use: cart` tier goes to the top of modelRoute.nginx.peers
#
# The route never points anywhere else. A CART holds one model's prefix cache, so
# it belongs to the release that owns that model and is never shared or borrowed
# from elsewhere -- which is why there is nothing to configure.
#
# A deployed CART is therefore always a routed CART, and there is no switch under
# modelRoute to separate the two. Nor is separating them useful: autoconfig
# writes CART's worker list off that very CR, so a CART with no ModelRoute naming
# it never gets one -- it waits in Init (deliberately, rather than CrashLooping)
# and then CrashLoops on the empty list once waitForWorkers gives up.
#
# The one case for an unrouted CART is the subchart's standalone mode, where the
# workers are written into baseConfig below by hand. That means this on and
# modelRoute.enabled off -- not a CART deployed alongside a route that ignores it.
cart:
  enabled: true
  # One ConfigMap, two keys: config.yaml is the chart's base (baseConfig below) and
  # workers.yaml is autoconfig's, written off the ModelRoute. The chart's template
  # never emits that key, so helm upgrade has nothing to patch there and the two stop
  # contending over one document. modelRoute.cart.outputKey follows this.
  configOverlays:
    - key: workers.yaml
      autoconfig: true
  # image:
  #   repository: 4pdosc/cache_aware_router
  #   tag: ""            # defaults to the subchart's appVersion
  # CART's listen port, which the ModelRoute's cart.port follows.
  # service:
  #   port: 8071
  # Per-model tuning of the static config.yaml base (workers land in the override
  # overlay above). Replaces the whole document, so copy the subchart's default first.
  # baseConfig: |
  #   ...
  # resources:
  #   limits: { cpu: "4", memory: 4Gi }
  # Scheduling. CART is CPU-only, so it has no business occupying a GPU node --
  # pin it away if yours are tainted or scarce. affinity ADDS to the subchart's
  # HA anti-affinity (which keeps the two replicas off one node) instead of
  # replacing it; write your own podAntiAffinity to override that.
  # nodeSelector: {}
  # tolerations: []
  # affinity: {}

# Publish this deployment to autoconfig as a ModelRoute
# (routing.modelsphere.dev/v1alpha1), so openresty's peers and the CART workers
# follow the pods instead of being maintained by hand.
#
# Requires the ModelRoute CRD, which ships with the autoconfig chart. With it
# absent, enabling this fails the install with "no matches for kind ModelRoute"
# -- the chart does not carry a copy, because the operator owns that schema.
#
# LLMScaler and ModelRoute are complementary and independent: the scaler decides
# how many replicas there are, and autoconfig keeps the routes matching whatever
# it decides. Neither needs the other.
modelRoute:
  enabled: true
  # ModelRoute name; also the default openresty route (external path
  # 8080/<name>/) and the default monitor model name. Defaults to the release
  # name.
  #
  # The CR is always created in the release namespace, alongside the Deployment,
  # so it is installed and removed with the rest of the release. Autoconfig
  # watches cluster-wide and every reference below is fully qualified
  # ("ns/name"), so openresty, CART and monitor can still live elsewhere.
  name: ""
  annotations: {}

  # The backend bucket that feeds CART's workers, nginx's backend peers and
  # monitor's service rows.
  #
  # Which backends those are is NOT configurable: it is always this release's own
  # Service on service.port. Routing from the chart that owns the Deployment is
  # the point -- the two cannot drift, and a scale event is all it takes for
  # every route to follow. To route to something else, write a ModelRoute for it
  # there, or by hand.
  discovery:
    # Ready endpoints only, by default. Endpoints being drained are excluded
    # either way.
    includeNotReady: false

  slo:
    # Off keeps the static ttft_limit_ms / tps_limit_tps in nginx.values.
    enabled: true
    # metadata.name of the LLMSLORequirement whose thresholds replace them.
    # "ns/name" crosses namespaces. Empty means the top-level serviceId, which is
    # also what sloRequirement.name defaults to, so the two meet by default.
    name: ""

  # The openresty (nginx) route. This is the only required section.
  nginx:
    # Defaults to the ModelRoute name above. It becomes the conf file name, the
    # openresty dict name, the unix socket name and the external path key, so it
    # must be [a-z0-9._-] only.
    route: ""
    # REQUIRED: the ConfigMap autoconfig writes the route into ("ns/name"),
    # shared by every model on one openresty with a key per route. There is no
    # default the chart could guess -- e.g. llm-route/openresty-conf.
    outputConfigMap: ""
    # Optional openresty entrypoint Service ("ns/name"). Feeds monitor's nginx
    # row and makes entrypoint scaling event-driven. Falls back to selector when
    # empty; service wins when both are set.
    service: ""
    selector: ""
    # Arbitrary tuning knobs, rendered verbatim into openresty's lua route table
    # (so a new knob needs no chart change). Common ones: ttft_limit_ms,
    # tps_limit_tps, adaptive_cc_min, default_max.
    #
    # These merge with the defaults below rather than replacing them, so setting
    # one knob does not silently drop the others.
    values:
      # Echo the chosen backend back to the caller as
      #   X-Routed-Peer: <ip:port>|<GPU model>|<node>
      # which is what turns "this request was slow" into "this request was slow
      # on that machine" without having to correlate logs.
      #
      # openresty itself defaults this off, on the view that internal peers
      # should not leak. On by default here because every route this chart is
      # used for has wanted it, and re-stating it per route was pure repetition.
      # Set it to "false" for any route whose callers should not see your
      # topology -- anything reachable from outside the cluster, in particular.
      expose_routed_peer: "true"
      # Setting tps_limit_tps opts into adaptive concurrency (AIMD): when the
      # decode rate falls below this, the concurrency ceiling shrinks.
      # tps_limit_tps: "30"
      # Concurrency for any peer with no maxConcurrency of its own.
      # default_max: "120"
    # Ordered peer groups, highest priority first. Traffic only cascades to a
    # lower tier once every peer above it is banned.
    #
    # The default is the two tiers that need nothing outside this chart: direct
    # pod IPs, then the Service ClusterIP underneath. That bottom tier is a
    # static safety net -- if autoconfig is down during a rollout, every pod IP
    # it knows can be stale at once, and the ClusterIP still resolves because
    # kube-proxy maintains it.
    #
    # A cart tier is added on top of whatever is listed here whenever the route
    # has a CART (cart.enabled above), at one priority higher than the highest
    # below, so it leads and traffic still cascades down when it is banned. It
    # carries maxConcurrencyFromBackend, which sizes its limit dynamically as
    # (backend maxConcurrency x backend count) so it tracks scaling instead of
    # being pinned to a stale number -- unless no backend tier here carries a
    # maxConcurrency to multiply, in which case it is injected without a limit of
    # its own and falls back to values.default_max above.
    #
    # Naming a cart peer explicitly turns the injection off and takes this list
    # exactly as written -- the way to pin its priority or its concurrency:
    #   - use: cart
    #     priority: 9
    #     maxConcurrency: 400
    peers:
      - use: backend
        priority: 2
        maxConcurrency: 100
      - use: backend-svc
        priority: 1

  # Cache-aware router (CART) in front of the backends. Off means nginx talks to
  # them directly.
  #
  # Which CART is NOT configurable, for the same reason discovery is not: it is
  # always the one cart.enabled deployed above, reached through its ClusterIP so
  # a CART failover or rollout stays invisible to openresty. The chart knows the
  # Service and ConfigMap it generated and writes them straight in, so there is
  # no pair of names here that can drift apart. A CART is per-model and never
  # shared, so there is no other CART this route could sensibly name.
  #
  # There is no `enabled` here: cart.enabled above is the only switch, and a
  # deployed CART is always a routed one. A second flag could only restate that
  # or contradict it, and one that says "route to a CART" while quietly doing
  # nothing (because none was deployed) is worse than not having it.
  cart:
    # Per-worker max_load.
    maxLoad: 20

  # Write these backends into monitor's config as well. Monitor reloads it every
  # 60s on its own, so no sidecar is involved.
  monitor:
    enabled: true
    # REQUIRED when enabled: monitor's ConfigMap ("ns/name"), shared across
    # models with one key per model.
    outputConfigMap: ""
    # Defaults to the top-level serviceId.
    model: ""
    # Empty means autoconfig derives it from the node's GPU label
    # (nvidia.com/gpu.product, set by GFD). Set it only to override that, or
    # where no such label exists.
    gpuType: ""
    # Monitor's nginx and router rows, both on by default when the sections they
    # reuse are configured (nginx.service and cart respectively). Set to false
    # to turn one off; null leaves autoconfig's default in place.
    nginx: null
    router: null

# Additional environment variables on the vLLM container.
env: []
  # - name: HF_TOKEN
  #   valueFrom:
  #     secretKeyRef:
  #       name: huggingface
  #       key: token

# Additional volumes on the output Deployment definition. The model volume built
# from model.localPath is always mounted; these are added alongside it.
#
# Be careful with hostPath: with the scaler on, several replicas can land on one
# node and would then share it. Read-only reference data (the model itself) is
# fine that way. Anything the server WRITES is not -- a JIT or compile cache
# shared by concurrent pods corrupts, so give those an emptyDir per pod.
volumes: []
  # - name: shm
  #   emptyDir:
  #     medium: Memory
  #     sizeLimit: 8Gi

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: shm
  #   mountPath: /dev/shm

# CPU, memory and ephemeral-storage for the engine container. Merged with the
# GPU limit, which stays derived from model.gpus -- naming nvidia.com/gpu here
# is refused at render time, so only one place ever says how many GPUs.
#
# ephemeral-storage is the one worth setting deliberately. It covers the
# container's writable layer, its logs, and every non-memory-backed emptyDir --
# all of it on the filesystem holding the kubelet root directory
# (/var/lib/kubelet), NOT the disk model.localPath points at, which is a
# hostPath and is never counted. The request is what the scheduler subtracts
# from the node, so without one it will happily pack more replicas onto a node
# than its disk can hold; the limit is what evicts a pod that overruns. Size it
# past the emptyDir sizeLimits in volumes above.
#
# Leaving memory unset is normal for a GPU workload: the weights sit in VRAM,
# and a limit guessed too low OOM-kills the pod partway through a load that
# would otherwise have succeeded. Set it once you have measured RSS.
resources: {}
  # requests:
  #   cpu: "8"
  #   memory: 64Gi
  #   ephemeral-storage: 20Gi
  # limits:
  #   memory: 96Gi
  #   ephemeral-storage: 20Gi

# securityContext for the vLLM container. Empty means the image's own.
#
# The one worth knowing about on an RDMA fabric is IPC_LOCK: without it the
# container cannot raise its locked-memory limit and the driver cannot pin its
# buffers. It is a single capability, not privileged mode:
#
#   securityContext:
#     capabilities:
#       add: ["IPC_LOCK"]
#
# rdma.enabled below adds it for you.
securityContext: {}

# Extra labels on the pods -- not on the Deployment object, and never on its
# selector, which is immutable. The place for anything an admission webhook keys
# off, e.g. rdma-injector's `rdma-ib: "true"` -- which rdma.enabled below adds,
# together with the RDMA resource and IPC_LOCK it needs to be any use.
podLabels: {}

# RDMA for multi-node (lws.enabled) on an InfiniBand fabric, as one switch. On
# sets the three things an RDMA pod needs together, so none of them is left out:
#
#   - pod label rdma-ib: "true"  -> rdma-injector (charts/rdma-injector) sources
#     the node's healthy HCAs into NCCL_IB_HCA at container start
#   - resources.limits "rdma/hca_shared": 1 -> one RDMA device from the
#     shared-device plugin
#   - capability IPC_LOCK -> the driver can pin its buffers
#
# Off by default because each of them assumes something about the cluster: the
# resource makes the pod Pending forever where no plugin advertises it, IPC_LOCK
# is refused in a
# namespace enforcing Pod Security "baseline" or stricter, and the label gets a
# pod rejected if rdma-injector was removed but its webhook configuration left
# behind (failurePolicy: Fail).
#
# Anything already written under podLabels, resources or securityContext for
# the same key is kept as written. Applies to every engine pod; outside
# lws.enabled nothing crosses nodes, so it buys nothing there.
#
# The resource name is fixed to rdma/hca_shared, what our shared-device plugin
# is configured to advertise. On a cluster whose plugin uses another name, leave
# this off and set the three by hand under podLabels, resources and
# securityContext.
rdma:
  enabled: false

# A PodDisruptionBudget over the engine pods, so a node drain or a
# cluster-autoscaler scale-down cannot take this model out all at once. The CART
# subchart has its own (cart.podDisruptionBudget) and is unaffected by this.
#
# On by default, which is safe only because the default budget is
# maxUnavailable: it is relative to the live replica count, so it can never
# become unsatisfiable and never blocks a drain outright. At the chart's own
# single-replica default it is simply a no-op (one replica, one disruption
# allowed). Switching to minAvailable is what makes this object able to say no,
# and that is the case to think before enabling -- see below.
#
# Read the header of templates/pdb.yaml before tuning this. The short version of
# what a PDB is NOT: it does not keep replicas alive (a crash, an OOM kill or the
# scaler scaling down are not disruptions it can refuse), and it does not govern
# `helm upgrade` -- rollouts go through strategy instead.
podDisruptionBudget:
  enabled: true
  annotations: {}

  # Exactly one of minAvailable / maxUnavailable, the other left empty. The API
  # server rejects a PDB with both or with neither, so the chart fails the render
  # rather than let the install fail.
  #
  # maxUnavailable is the default here because it is the one that stays correct
  # while the fleet resizes underneath it: "at most one at a time" means the same
  # thing at 2 replicas and at 40, and it can never reach zero allowed
  # disruptions, so a node drain always makes progress.
  maxUnavailable: 1

  # minAvailable is the other half, and the one to reach for when there is a
  # floor that matters more than drain speed -- "keep at least 8 serving, take as
  # many of the rest as you like".
  #
  # It has a foot-gun the chart guards against: disruptionsAllowed is
  # (healthy - minAvailable), so a minAvailable that meets or exceeds the fleet's
  # floor (scaler.minReplicas, or replicaCount without the scaler) allows ZERO
  # evictions the moment the fleet is at that floor. A drain then blocks forever
  # -- it retries rather than times out, and the scaler adds replicas for
  # traffic, not because a drain is waiting. `minAvailable: 1` on a one-replica
  # release is that mistake in its most common form, and rendering fails with the
  # arithmetic spelled out.
  #
  # Percentages ("50%") are counted in PODS and rounded up.
  minAvailable: ""

  # AlwaysAllow | IfHealthyBudget | "" (leave the API server's default,
  # IfHealthyBudget).
  #
  # This is the field that decides whether a drain can ever get unstuck. Under
  # IfHealthyBudget a pod that is not Ready may only be evicted while the budget
  # is already satisfied -- so a fleet that is one replica short cannot be
  # drained at all, including the very pod that is stuck. On this chart "not
  # Ready" is also the normal state for the ~20 minutes a large model spends
  # loading, which makes that window routine rather than exceptional.
  #
  # AlwaysAllow gives up nothing real in exchange: an unready pod is serving no
  # traffic, so evicting it costs a restart, not availability.
  #
  # Needs Kubernetes >= 1.27 (>= 1.26 with the PDBUnhealthyPodEvictionPolicy gate
  # on). An older API server silently drops the field, which is the old
  # behaviour rather than an error -- set it to "" if you would rather not carry
  # a field your cluster ignores.
  unhealthyPodEvictionPolicy: AlwaysAllow

# How a `helm upgrade` -- or any change to the pod template -- replaces the
# running pods.
#
# The default is the gentle order: start a new replica, wait for it to pass its
# probes, and only then take an old one away. Capacity never dips below the
# current replica count, which matters here because a replacement takes minutes
# to load a model, not seconds.
#
# What it costs is a free GPU slot. maxSurge: 1 means one extra replica exists
# during the rollout, so with model.gpus GPUs each, a cluster with nothing spare
# leaves the new pod Pending and the rollout stalls until progressDeadlineSeconds
# expires. The old pods keep serving throughout, so that is a visible stall
# rather than an outage -- but if your GPUs are always fully allocated, flip to
# maxSurge: 0 / maxUnavailable: 1 and accept losing one replica's capacity while
# the rollout walks through the fleet. Where a model needs every GPU on its node
# and two copies can never coexist, `type: Recreate` is the honest choice: it
# tears down the old pods first, at the price of a full outage during the swap.
#
# Absolute counts rather than the percentage forms, which round in opposite
# directions (maxSurge up, maxUnavailable down) and are easy to get wrong at
# small replica counts.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# How long a rollout has to get the new pod Ready before the Deployment is
# marked ProgressDeadlineExceeded. That is not a rollback -- the old pods keep
# serving and the new one keeps trying -- but it is what `kubectl rollout status`
# and GitOps controllers report as a failed rollout, so it should not fire on a
# model that is simply slow to load.
#
# It has to clear the startupProbe budget (failureThreshold x periodSeconds,
# 5400s with the values above) plus image pull and scheduling. The chart
# checks the probe half at render time; the pull is on you, and a multi-GB engine
# image landing on a cold node can take several minutes on its own.
progressDeadlineSeconds: 7200

# How many old ReplicaSets to keep for rollback. They hold no pods, so this is
# about rollback depth, not resources.
revisionHistoryLimit: 10

schedulerName: ""

# PriorityClass for every pod this chart makes.
#
# It does not defragment anything. Preemption frees space on ONE node by killing
# lower-priority pods there; it never repacks existing pods, and does nothing at
# all if there is no lower-priority work to evict. What it does buy is queue
# order and a say in who loses when capacity is short.
priorityClassName: ""

# Pin the GPU pods to particular nodes. `affinity` is the place for node
# affinity / anti-affinity rules; nodeSelector and tolerations are the simpler
# forms of the same idea.
nodeSelector: {}

tolerations: []

affinity: {}
