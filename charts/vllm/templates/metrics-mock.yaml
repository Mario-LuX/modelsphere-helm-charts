{{- if .Values.metricsMock.enabled }}
# A stand-in for Prometheus that returns a fixed metric value, so the LLMScaler
# can be driven to scale on demand (opt-125m never fills its KV cache enough to
# trip a real threshold). http-echo returns the same body for any path/query,
# including /api/v1/query, mimicking the Prometheus instant-query response.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-metrics-mock
  labels:
    app: {{ .Release.Name }}-metrics-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-metrics-mock
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-metrics-mock
    spec:
      containers:
        - name: http-echo
          image: {{ .Values.metricsMock.image | quote }}
          args:
            - "-listen=:5678"
            - '-text={"status":"success","data":{"result":[{"value":[0,"{{ .Values.metricsMock.value }}"]}]}}'
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-metrics-mock
  labels:
    app: {{ .Release.Name }}-metrics-mock
spec:
  selector:
    app: {{ .Release.Name }}-metrics-mock
  ports:
    - port: 9090
      targetPort: 5678
{{- end }}
