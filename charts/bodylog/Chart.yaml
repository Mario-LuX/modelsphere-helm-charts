apiVersion: v2
name: bodylog
description: "Body-log listener for the OpenResty router: receives full request/response frames over TCP, writes them as hourly JSONL, and serves rollups over HTTP"
home: https://github.com/modelsphere/helm-charts
sources:
  - https://github.com/modelsphere/helm-charts
  - https://github.com/modelsphere/llm-openresty
type: application
# The chart version tracks appVersion for this chart, so the chart and the image
# it ships share one number. Not a rule for every chart here: cart carries a
# chart version of its own, independent of the app it ships.
version: 0.1.13
# The listener image tag: values.image.tag is empty by default and falls back to
# this, so a release moves both together.
#
# 0.1.13 is the actual release line -- it is the newest bodylog/v* tag upstream,
# the version ChartMuseum serves, and the image the clusters run. "1.0.0" was a
# placeholder that an internal pipeline rewrote from the tag at publish time, so
# it named a release that never existed.
appVersion: "0.1.13"
keywords: [bodylog, openresty, observability]
