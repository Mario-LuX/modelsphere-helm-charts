apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jobslorequirements.inference.modelsphere.dev
  annotations:
    helm.sh/resource-policy: keep
spec:
  conversion:
    strategy: None
  group: inference.modelsphere.dev
  names:
    kind: JobSLORequirement
    listKind: JobSLORequirementList
    plural: jobslorequirements
    shortNames:
    - jobslo
    singular: jobslorequirement
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.minimumDeployment.value
      name: Min_Replicas
      type: integer
    - jsonPath: .spec.maximumDeployment.value
      name: Max_Replicas
      type: integer
    - jsonPath: .spec.priority
      name: Priority
      type: integer
    - jsonPath: .spec.queue.maxDepth
      name: Max_Queue_Depth
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              maximumDeployment:
                properties:
                  type:
                    default: replica
                    enum:
                    - replica
                    type: string
                  value:
                    description: >-
                      Highest replica count the decision service may
                      recommend. 0 (with minimumDeployment.value also 0)
                      turns the service off.
                    minimum: 0
                    type: integer
                type: object
              minimumDeployment:
                default:
                  type: replica
                  value: 1
                properties:
                  type:
                    default: replica
                    enum:
                    - replica
                    - concurrency
                    type: string
                  value:
                    description: >-
                      Lowest replica count the decision service may recommend.
                      0 enables scale-to-zero: an idle service is scaled all the
                      way down.
                    default: 1
                    minimum: 0
                    type: integer
                type: object
              priority:
                default: 0
                description: Priority level from 0 to 10. Deployments with higher
                  priority acquire nodes first.
                maximum: 10
                minimum: 0
                type: integer
              queue:
                description: Queue SLO configuration for async job workloads.
                properties:
                  maxDepth:
                    description: Target maximum number of pending jobs per replica.
                      The autoscaler adds replicas when observed queue depth per
                      replica exceeds this threshold.
                    minimum: 0
                    type: integer
                  promql:
                    description: |
                      PromQL expression that evaluates to the current queue depth
                      for this service (a single scalar or a series labeled by
                      service). decision-gen executes this against the platform
                      Prometheus to get the observed queue size compared against
                      maxDepth per replica. Example:
                        sum(jobs_pending{service="my-image-gen"})
                        rabbitmq_queue_messages{queue="my-service"}
                    minLength: 1
                    type: string
                required:
                - maxDepth
                - promql
                type: object
              serviceId:
                description: Identifier referencing the target service.
                type: string
            required:
            - queue
            - serviceId
            type: object
            x-kubernetes-validations:
            - rule: "!has(self.maximumDeployment) || self.minimumDeployment.value <= self.maximumDeployment.value"
              message: minimumDeployment.value must be less than or equal to maximumDeployment.value
            - rule: "!has(self.maximumDeployment) || self.minimumDeployment.value != 0 || self.maximumDeployment.value == 0"
              message: maximumDeployment.value must be 0 when minimumDeployment.value is 0 (scale-to-zero is only for temporarily suspending the service)
        type: object
    served: true
    storage: true
    subresources:
      status: {}
