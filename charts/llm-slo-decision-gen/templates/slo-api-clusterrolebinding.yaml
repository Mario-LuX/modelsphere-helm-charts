{{- if .Values.sloApi.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-slo.sloApi.clusterRoleName" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-slo.sloApi.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: slo-api
    namespace: {{ .Release.Namespace }}
{{- end }}
