{{- if .Values.decisionGen.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: decision-gen
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    app: decision-gen
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: decision-gen
  labels:
    app: decision-gen
rules:
  # Aligned with operator/config/rbac/rbac.yaml — do not add rules here that
  # decision_gen's code doesn't exercise. pod/service/endpoint/replicaset
  # reads were removed after k8s_state gained placement-based lookups.
  # Reads SLO definitions; never writes status.
  # Both groups, for the same reason as slo-api's role below: the CRDs are
  # moving from inference.x-k8s.io to inference.modelsphere.dev, clusters are
  # on either side, and a role that names one leaves the workload unable to
  # read the CRDs the cluster actually serves -- which reads as "no SLOs
  # configured", not as an error.
  - apiGroups: ["inference.modelsphere.dev", "inference.x-k8s.io"]
    resources: ["llmslorequirements"]
    verbs: ["get", "list", "watch"]
  # Same for async-job SLOs.
  - apiGroups: ["inference.modelsphere.dev", "inference.x-k8s.io"]
    resources: ["jobslorequirements"]
    verbs: ["get", "list", "watch"]
  # pool_capacity() enumerates GPU nodes.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  # Scaling targets.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["leaderworkerset.x-k8s.io"]
    resources: ["leaderworkersets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: decision-gen
  labels:
    app: decision-gen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: decision-gen
subjects:
  - kind: ServiceAccount
    name: decision-gen
    namespace: {{ include "llm-slo.namespace" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: decision-gen
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    app: decision-gen
spec:
  type: ClusterIP
  selector:
    app: decision-gen
  ports:
    - name: http
      port: {{ .Values.decisionGen.service.port }}
      targetPort: {{ .Values.decisionGen.service.targetPort }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-gen
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    app: decision-gen
spec:
  replicas: {{ .Values.decisionGen.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: decision-gen
  template:
    metadata:
      labels:
        app: decision-gen
    spec:
      serviceAccountName: decision-gen
      containers:
        - name: decision-gen
          image: "{{ .Values.decisionGen.image.repository }}:{{ .Values.decisionGen.image.tag }}"
          imagePullPolicy: {{ .Values.decisionGen.image.pullPolicy }}
          ports:
            - name: {{ .Values.decisionGen.container.name }}
              containerPort: {{ .Values.decisionGen.container.port }}
              protocol: TCP
          {{- with .Values.decisionGen.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.decisionGen.probes.liveness.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.decisionGen.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.decisionGen.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.decisionGen.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.decisionGen.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.decisionGen.probes.readiness.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.decisionGen.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.decisionGen.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.decisionGen.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.decisionGen.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.decisionGen.resources | nindent 12 }}

{{- if .Values.decisionGen.unstable.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: decision-gen-unstable
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    app: decision-gen-unstable
spec:
  type: ClusterIP
  selector:
    app: decision-gen-unstable
  ports:
    - name: http
      port: {{ .Values.decisionGen.service.port }}
      targetPort: {{ .Values.decisionGen.service.targetPort }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-gen-unstable
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    app: decision-gen-unstable
spec:
  replicas: {{ .Values.decisionGen.unstable.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: decision-gen-unstable
  template:
    metadata:
      labels:
        app: decision-gen-unstable
    spec:
      serviceAccountName: decision-gen
      containers:
        - name: decision-gen
          image: "{{ .Values.decisionGen.image.repository }}:{{ .Values.decisionGen.image.tag }}"
          imagePullPolicy: {{ .Values.decisionGen.image.pullPolicy }}
          ports:
            - name: {{ .Values.decisionGen.container.name }}
              containerPort: {{ .Values.decisionGen.container.port }}
              protocol: TCP
          {{- with .Values.decisionGen.unstable.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.decisionGen.probes.liveness.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.decisionGen.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.decisionGen.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.decisionGen.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.decisionGen.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.decisionGen.probes.readiness.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.decisionGen.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.decisionGen.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.decisionGen.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.decisionGen.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.decisionGen.unstable.resources | nindent 12 }}
{{- end }}
{{- end }}
