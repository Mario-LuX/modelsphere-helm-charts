{{- if .Values.sloApi.enabled }}
# Token for slo-api clients. Decision order:
#   1. values.sloApi.token if the operator pinned one
#   2. existing Secret data.token (preserved across upgrades)
#   3. freshly generated on first install
{{- $secretName := "slo-api" }}
{{- $ns := .Release.Namespace }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $token := .Values.sloApi.token }}
{{- if and (empty $token) $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
{{- if empty $token }}
{{- $token = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
type: Opaque
stringData:
  token: {{ $token | quote }}
{{- end }}
