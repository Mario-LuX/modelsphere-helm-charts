{{- if .Values.sloApi.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slo-api
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "llm-slo.sloApi.clusterRoleName" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
rules:
  # slo-api stores SLO configs but does not own CR lifecycle: the operator
  # creates/deletes CRs and writes /status. slo-api only reads + patches
  # existing ones in place.
  #
  # BOTH groups. The CRDs are moving from inference.x-k8s.io to
  # inference.modelsphere.dev and clusters are on either side of that; from
  # 0.2.0 the image asks the API server which one it serves and uses that.
  # Granting only the new group leaves it able to choose a group it cannot
  # read, and RBAC denial looks exactly like an empty cluster: the pod stays
  # Running, the watch retries, and GET /config answers with an empty list.
  - apiGroups: ["inference.modelsphere.dev", "inference.x-k8s.io"]
    resources: ["llmslorequirements"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Same contract for async-job SLOs.
  - apiGroups: ["inference.modelsphere.dev", "inference.x-k8s.io"]
    resources: ["jobslorequirements"]
    verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-slo.sloApi.clusterRoleName" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-slo.sloApi.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: slo-api
    namespace: {{ include "llm-slo.namespace" . }}
---
# Token for slo-api clients. Decision order:
#   1. values.sloApi.token if the operator pinned one
#   2. existing Secret data.token (preserved across upgrades)
#   3. freshly generated on first install
{{- $secretName := "slo-api" }}
{{- $ns := include "llm-slo.namespace" . }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $token := .Values.sloApi.token }}
{{- if and (empty $token) $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
{{- if empty $token }}
{{- $token = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
type: Opaque
stringData:
  token: {{ $token | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: slo-api
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
spec:
  type: ClusterIP
  selector:
    app: slo-api
  ports:
    - name: http
      port: {{ .Values.sloApi.service.port }}
      targetPort: {{ .Values.sloApi.service.targetPort }}
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slo-api
  namespace: {{ include "llm-slo.namespace" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: slo-api
spec:
  replicas: {{ .Values.sloApi.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  selector:
    matchLabels:
      app: slo-api
  template:
    metadata:
      labels:
        {{- include "llm-slo.labels" . | nindent 8 }}
        app: slo-api
    spec:
      serviceAccountName: slo-api
      containers:
        - name: slo-api
          image: "{{ .Values.sloApi.image.repository }}:{{ .Values.sloApi.image.tag }}"
          imagePullPolicy: {{ .Values.sloApi.image.pullPolicy }}
          ports:
            - name: {{ .Values.sloApi.container.name }}
              containerPort: {{ .Values.sloApi.container.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.sloApi.container.port | quote }}
            - name: SLO_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slo-api
                  key: token
          livenessProbe:
            httpGet:
              path: {{ .Values.sloApi.probes.liveness.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.sloApi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sloApi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.sloApi.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.sloApi.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.sloApi.probes.readiness.path }}
              port: http
              scheme: HTTP
            initialDelaySeconds: {{ .Values.sloApi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sloApi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.sloApi.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.sloApi.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.sloApi.resources | nindent 12 }}
{{- end }}
