{{- if .Values.decisionGen.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "llm-slo.decisionGen.clusterRoleName" . }}
  labels:
    {{- include "llm-slo.labels" . | nindent 4 }}
    app: decision-gen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "llm-slo.decisionGen.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: decision-gen
    namespace: {{ .Release.Namespace }}
{{- end }}
