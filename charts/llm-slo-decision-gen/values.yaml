# Default settings for the llm-slo-decision-gen chart.
#
# Install into the desired namespace with `helm install -n <ns>` /
# `helm upgrade --install -n <ns>`. Workloads use {{ .Release.Namespace }}.
# Service DNS is http://decision-gen.<Release.Namespace>.svc:80 (and siblings).

# ---------------------------------------------------------------------------
# decision-gen: emits per-service replica decisions on :8080/decisions.
# The "unstable" variant (when enabled) is a second Deployment/Service so a
# ModelRoute / LLMScaler can opt into a debug-logging instance without
# affecting consumers of the stable endpoint.
# ---------------------------------------------------------------------------
decisionGen:
  enabled: true
  replicas: 1
  image:
    repository: 4pdosc/llm-scaler-decision-gen
    ## 0.7.0 is the first release that reads LLMSLORequirement from
    ## inference.modelsphere.dev; earlier tags read the old group.
    tag: "0.7.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: http
  container:
    port: 8080
    name: http
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # Env is verbatim. No secrets required.
  env: []

  # Optional second Deployment/Service (decision-gen-unstable). Mirrors the
  # source repo's config/manager/manager-unstable.yaml: SAME image as stable,
  # with LOG_LEVEL=DEBUG. There is no distinct "unstable" image tag on
  # Docker Hub (4pdosc/llm-scaler-decision-gen only publishes numbered
  # releases). Off by default so a normal install does not run two copies;
  # set enabled: true if you want the debug endpoint.
  unstable:
    enabled: false
    replicas: 1
    env:
      - name: LOG_LEVEL
        value: DEBUG
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ---------------------------------------------------------------------------
# slo-api: optional HTTP/UI for editing LLMSLORequirement / JobSLORequirement
# specs by route. Holds a token secret (auto-generated at install when token
# is empty). Nothing else in the stack calls it. Off by default.
#
# The image must be 0.2.0 or newer: v0.1 looks for LLMSLORequirement under
# inference.x-k8s.io only, and would find nothing on a cluster that has
# migrated. 0.2.0 asks the API server which group it serves.
# ---------------------------------------------------------------------------
sloApi:
  enabled: false
  replicas: 1
  image:
    repository: 4pdosc/llm-slo-api
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: http
  container:
    port: 8080
    name: http
  # If set, the chart writes this literal value into the Slo-Api Secret
  # under key "token". Leave empty to let the chart generate a random one.
  # Read the value after install with
  #   kubectl get secret slo-api -n <Release.Namespace> -o jsonpath='{.data.token}' | base64 -d
  token: ""
  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
    readiness:
      path: /readyz
      initialDelaySeconds: 2
      periodSeconds: 10
      timeoutSeconds: 1
      failureThreshold: 3
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
