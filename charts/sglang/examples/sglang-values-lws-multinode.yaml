# Multi-node SGLang via LeaderWorkerSet -- Kimi K2.5 on 2x H100 nodes (TP8 x PP2),
# RDMA over InfiniBand. This is the chart form of a live deployment (the
# hand-written manifest it was ported from is kimi-k2.5/kimi-lws.yaml in the
# inference-stack-k8s repo); consult the real GitOps repo for deploy values.
#
#   helm install kimi-k25 ./charts/sglang -n kimi -f examples/sglang-values-lws-multinode.yaml
#
# Prerequisites in the cluster, none of which this chart installs:
#   - the LWS controller (CRD leaderworkersets.leaderworkerset.x-k8s.io)
#   - rdma-shared-dev-plugin, for the rdma/hca_shared resource below
#   - node_prep_rdma.sh having written /etc/gpu-node/nccl-ib.env on each GPU node
#   - rdma-injector (charts/rdma-injector), which turns the rdma-ib label below
#     into that file being mounted and sourced -- so NCCL_IB_HCA is never
#     written here: at admission the pod is not scheduled yet, and the healthy
#     HCAs are a per-node answer.
#   - the model already on both nodes at model.localPath

lws:
  enabled: true
  # 2 nodes per instance. One leader (rank 0, serves the API) + one worker.
  size: 2

# The LLMScaler targets the LeaderWorkerSet (its /scale subresource), so a
# replica below is a whole 2-pod GROUP: max 2 means at most 4 pods / 32 GPUs.
#
# Custom provider -- the count comes off the decision server, and the PromQL
# metrics block is not read at all.
scaler:
  enabled: true
  metricProvider: Custom
  serverAddress: "http://decision-gen.llm-scaler.svc:80"
  customProvider:
    serviceId: "kimi-k25"
    path: "/decisions"
    # The server reports this serviceId in more than one namespace, so the match
    # has to be narrowed or it is an error rather than a choice.
    namespace: "kimi"
  minReplicas: 1
  maxReplicas: 2
  syncPeriodSeconds: 10
  scaleDown:
    behavior: CacheAware
    # A group is 2 nodes and a ~10 minute cold load; do not let a brief dip take one down.
    stabilizationWindowSeconds: 300
    maxStepReplicas: 2

image:
  repository: "harbor.4pd.io/hardcore-tech/sglang"
  tag: "v0.5.10.post1-gm-fix-v0.1"

model:
  name: "kimi-k2.5"
  localPath: "/mnt/disk0/models/Kimi-K2.5"
  mountPath: "/model"
  # PER POD, not per group: 8 GPUs on each of the 2 nodes, which is what
  # --tp=8 --pp-size=2 below then spans.
  gpus: "8"
  # Let SGLang use the model's own -- pinning a number here would cap K2.5.
  contextLength: ""

# The parallelism layout, and only that: --nnodes, --node-rank and
# --dist-init-addr come from the group and are rejected here.
#
# TP inside a node (NVLink), PP across the two (the IB fabric) -- the split that
# keeps the all-reduce traffic off the slower link.
extraArgs:
  - "--tp=8"
  - "--pp-size=2"
  # How long the leader waits at the rendezvous for its workers. torch's NCCL
  # default is 600s, which a worker's cold start (image pull + model-check +
  # python) can lose to -- and the leader then EXITS, restarting the group into
  # the same race, with the startupProbe budget below never reaching its 20
  # minutes. Sized to cover the worst cold start instead. Confirm the unit for
  # your build: python3 -m sglang.launch_server --help | grep dist-timeout
  - "--dist-timeout=1800"
  - "--trust-remote-code"
  - "--enable-cache-report"
  - "--stream-response-default-include-usage"
  - "--tokenizer-worker-num=4"
  - "--tool-call-parser=kimi_k2"
  - "--reasoning-parser=kimi_k2"

service:
  port: 8050

# Triggers rdma-injector on every pod of every group. See the prerequisites above.
podLabels:
  rdma-ib: "true"

# IPC_LOCK, not privileged: it is what lets the container raise its
# locked-memory limit (the `ulimit -l unlimited` the chart runs before exec'ing
# SGLang) so the RDMA driver can pin its buffers.
securityContext:
  capabilities:
    add: ["IPC_LOCK"]

# Per POD -- each of the group's 2 nodes gets this. nvidia.com/gpu is NOT here on
# purpose: model.gpus renders it, and the chart refuses a second spelling.
#
# ephemeral-storage is the one worth setting even when cpu/memory are left to the
# node, because the volumes below make it concrete: the dot-cache emptyDir can
# reach 10Gi, and the writable layer and container logs sit on the same
# filesystem (the one holding /var/lib/kubelet). What does NOT count: /model is a
# hostPath, and /dev/shm is medium: Memory, so it is charged to memory instead.
#
# What it buys, in order of how likely it is to bite:
#   - a request the scheduler can honour. Without one the pod is placed as if it
#     wrote nothing, and two groups can land on a node that only has disk for one.
#   - blast radius. Something that fills the disk -- a CUDA core dump, or
#     NCCL_DEBUG turned up to INFO on a busy node, which is GBs per hour -- hits
#     the node's eviction threshold and the kubelet starts evicting pods by
#     usage, not just the guilty one. With a limit the kubelet evicts only this
#     pod, at a line you chose.
#
# That matters more under LWS than it would for a Deployment: evicting a leader
# takes the WHOLE group with it (restartPolicy: RecreateGroupOnPodRestart) and
# costs another ~10 minute cold load, so the pod that dies should be the one
# that misbehaved.
#
# Note this is NOT the same budget as the dot-cache emptyDir's own sizeLimit
# below, and the two are not alternatives:
#
#   sizeLimit          caps that ONE volume. Over it -> pod evicted.
#   ephemeral-storage  caps the pod TOTAL: that emptyDir, plus every container's
#                      writable layer, plus container logs. Over it -> pod evicted.
#
# So this has to stay strictly ABOVE the cache's sizeLimit, with room for the
# rest. Set equal (20Gi/20Gi) and a cache sitting at its own legal maximum has
# already spent the whole pod budget: the next log line evicts the pod for the
# total, while the cache is still legitimately under its own limit -- and the
# sizeLimit never gets to act as the guard rail it was added to be.
#
# 28Gi is a starting point, not a measurement: 20Gi the cache is allowed, ~8Gi
# for the writable layer and logs. Check it against `kubectl describe node`
# (ephemeral-storage allocatable) and the kubelet's summary API before treating
# it as the number.
#
# cpu and memory are deliberately absent: they are worth sizing from observed
# usage rather than guessed at, and a memory limit that forgets the 16Gi tmpfs
# below (it is charged to the container) turns a working pod into an OOMKill
# mid-load.
resources:
  requests:
    # Equal to the limit on purpose: disk is not compressible, so there is no
    # useful "burst above the request" the way there is for cpu.
    ephemeral-storage: 28Gi
  limits:
    # One shared HCA per pod, from rdma-shared-dev-plugin.
    rdma/hca_shared: "1"
    ephemeral-storage: 28Gi

env:
  - { name: NCCL_DEBUG, value: "WARN" }
  - { name: NCCL_IB_DISABLE, value: "0" }
  # GPUDirect RDMA when the GPU and the HCA are close enough on the PCIe tree.
  - { name: NCCL_NET_GDR_LEVEL, value: "2" }
  # No hostNetwork, so the pod's eth0 (Flannel) is the constant name for the
  # out-of-band path: NCCL's bootstrap and Gloo both use it. The IB path is
  # separate and comes from NCCL_IB_HCA, which the injector sets per node.
  - { name: NCCL_SOCKET_IFNAME, value: "eth0" }
  - { name: GLOO_SOCKET_IFNAME, value: "eth0" }
  - { name: PYTORCH_ALLOC_CONF, value: "expandable_segments:True" }
  - { name: NVIDIA_DISABLE_REQUIRE, value: "1" }

# Both emptyDir, i.e. one per pod. The model itself stays a hostPath (read-only
# reference data, mounted by the chart from model.localPath) -- these two are
# things the server WRITES, and the chart's rule for those is a volume that
# cannot be shared.
#
#   dshm    NCCL's intra-node transport needs real shared memory and the default
#           64MB /dev/shm is not enough. medium: Memory, so it is tmpfs -- and
#           charged to the container's MEMORY, not to ephemeral-storage.
#   dot-cache  torch/CUDA compile artifacts. The hand-written manifest used a
#           hostPath here, which on these 8-GPU nodes happens to be safe (a pod
#           claims all 8 GPUs, so two never co-schedule) -- but that invariant is
#           held by GPU capacity alone, and with the scaler free to add groups it
#           is not something to lean on: two pods writing one compile cache
#           corrupt it. The cost of emptyDir is a cold cache after every pod
#           recreation, which a restart here pays anyway.
volumes:
  - name: dshm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
  - name: dot-cache
    hostPath: { path: /root/deploy/kimi-k2.5/.cache_sglang_k8s, type: DirectoryOrCreate }
volumeMounts:
  - name: dshm
    mountPath: /dev/shm
  - name: dot-cache
    mountPath: /root/.cache

# Probes hit /v1/models rather than /health, from experience on this build:
# SGLang v0.5.10's /health answers 503 for a second or two after load finishes,
# and its meaning is not purely "model is up" (it can reflect backpressure).
# /v1/models is 200 from the moment the route binds and stays there.
#
# On the leader that bind is also the group's readiness signal: the port only
# comes up once the model is loaded AND the cross-node NCCL group has formed, so
# a 200 here means the whole instance is serving, worker included. Workers are
# not probed at all -- they run no HTTP server.
startupProbe:
  httpGet:
    path: /v1/models
    port: http
  periodSeconds: 15
  timeoutSeconds: 10
  # 80 x 15s = 20 minutes for a cold load of a model this size across two nodes.
  # Liveness and readiness stay suppressed for all of it.
  failureThreshold: 80
readinessProbe:
  httpGet:
    path: /v1/models
    port: http
  initialDelaySeconds: 60
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

# Liveness is the hang-watcher sidecar's /healthz (chart default), which is what
# makes a liveness probe safe on a model that takes ~10 minutes to load: the
# sidecar distinguishes "still loading" from "token_progress has stalled", so
# only a real hang restarts the leader -- and RecreateGroupOnPodRestart then
# rebuilds the group around it.
hangWatcher:
  enabled: true
  config:
    # A long prefill on K2.5 can legitimately freeze token_progress for a while;
    # stay well above the longest one you expect.
    stallSec: 300

# Long generations, so allow a long drain. Note what this number is: SGLang's
# post-SIGTERM drain has no timeout of its own, so this is the deadline that
# CUTS IT OFF, not a budget it stays inside.
terminationGracePeriodSeconds: 3600
lifecycle:
  preStop:
    enabled: true
    endpointSyncSeconds: 5
    # The bounded drain: the pod leaves as soon as it goes idle. What happens
    # after it -- SIGTERM to PID 1, then killing its children if it does not go
    # -- is lws.leaderPreStopKill.
    drainSeconds: 600
  # The draining already happened above, bounded and observable. SGLang's own
  # post-SIGTERM drain only repeats it with no timeout, and that is the loop a
  # terminating leader gets stuck in ("Waiting for child process") once its
  # workers are gone. Skip it. Both roles get the env, so workers -- which have
  # no preStop and no escalation of their own -- benefit too.
  forceShutdown: true

tolerations:
  - key: nvidia.com/gpu
    operator: Exists
    effect: NoExecute

# Both nodes of a group must be the same H100 SKU on the same driver: a
# mismatched driver across a NCCL group fails at rendezvous, minutes in.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: nvidia.com/gpu.product
              operator: In
              values: ["NVIDIA-H100-80GB-HBM3"]
            - key: nvidia.com/cuda.driver-version.full
              operator: In
              values: ["575.57.08"]

# Routing works exactly as it does for a single-node release: the chart's
# Service selects the leaders, so these point at "the model" without knowing
# there is a group behind it.
cart:
  enabled: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: nvidia.com/gpu.product
            operator: DoesNotExist
modelRoute:
  enabled: true
  name: "kimi-k2.5"
  nginx:
    outputConfigMap: "llm-route/openresty-conf"
    service: "llm-route/openresty"
    route: "kimi-k2.5"
    values:
      default_max: "50"
      kimi_normalize_default_enabled: "false"
      tps_limit_tps: "30"
      ttft_limit_ms: "20000"
  cart:
    maxLoad: 50
  monitor:
    enabled: true
    gpuType: H100
    model: kimi-k2.5
    outputConfigMap: monitoring/monitor-conf
