# Env values reach the Kubernetes API as strings, whatever YAML type the
# values file gave them: EnvVar.value is a string and server-side apply
# rejects a number or a bool ("expected string, got int", issue #76).
suite: env values render as strings
release:
  name: ci
set:
  modelRoute.nginx.outputConfigMap: ci/openresty-conf
  env:
    - name: ZERO
      value: 0
    - name: ONE
      value: 1
    - name: BIG
      value: 1000000000
    - name: FLOAT
      value: 0.5
    - name: ENABLED
      value: true
    - name: QUOTED
      value: "8"
    - name: FROM_FIELD
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
tests:
  - it: single-node engine container
    template: templates/deployment.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: QUOTED
            value: "8"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: pd colocate, both engine containers and the router
    template: templates/pd-colocate.yaml
    set:
      pd.colocate: true
      pd.enabled: true
      pd.prefill.gpus: 1
      pd.decode.gpus: 1
      rdma.enabled: true
      scaler.enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: QUOTED
            value: "8"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang")].env
          content:
            name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: QUOTED
            value: "8"
      - contains:
          path: spec.template.spec.containers[?(@.name == "sglang1")].env
          content:
            name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: QUOTED
            value: "8"
      - contains:
          path: spec.template.spec.containers[?(@.name == "router")].env
          content:
            name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name

  - it: pd disaggregated, every role's leader and worker
    template: templates/pd-ds.yaml
    set:
      pd.colocate: false
      pd.enabled: true
      pd.prefill.gpus: 1
      pd.decode.gpus: 1
      rdma.enabled: true
      scaler.enabled: false
    documentSelector:
      path: kind
      value: DisaggregatedSet
    asserts:
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ONE
            value: "1"
      - contains:
