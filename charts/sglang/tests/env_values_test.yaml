                fieldPath: metadata.name
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: QUOTED
            value: "8"
      - contains:
          path: spec.roles[0].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: QUOTED
            value: "8"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.leaderTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: FROM_FIELD
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ZERO
            value: "0"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ONE
            value: "1"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: BIG
            value: "1000000000"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: FLOAT
            value: "0.5"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: ENABLED
            value: "true"
      - contains:
          path: spec.roles[1].spec.leaderWorkerTemplate.workerTemplate.spec.containers[?(@.name == "sglang")].env
          content:
            name: QUOTED
