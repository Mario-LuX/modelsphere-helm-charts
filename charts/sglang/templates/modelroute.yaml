{{- if .Values.modelRoute.enabled -}}
{{- $mr := .Values.modelRoute }}
{{- $ownSvc := printf "%s/%s" .Release.Namespace (include "sglang.serviceName" .) }}

{{- $sloName := "" }}
{{- if $mr.slo.enabled }}
{{- $sloName = $mr.slo.name | default (include "sglang.serviceId" .) }}
{{- end }}

{{- /* Is there a CART in this route? cart.enabled is the whole answer, and the
       only switch: it deploys the CART (the vendored subchart in charts/cart)
       and routes through it, filling in the cart block below and adding the cart
       peer. There is deliberately no second switch here to say "route to a CART"
       independently -- it could only ever restate cart.enabled or contradict it,
       and a flag that cannot be honoured is worse than no flag.

       So a deployed CART is always a routed CART. That is also the only useful
       arrangement: autoconfig writes CART's worker list off this very CR, and a
       CART with no ModelRoute naming it never gets one (it waits in Init, then
       CrashLoops on the empty list -- see waitForWorkers in the subchart). To
       run one unrouted on purpose, leave modelRoute.enabled off entirely and
       write the workers into cart.baseConfig by hand.

       The CART in this route is ALWAYS the one this release deploys. A CART
       holds one model's prefix cache, so it belongs to the release that owns
       that model and is never shared or borrowed from elsewhere -- which is why
       nothing below names it. */}}
{{- $cartOn := .Values.cart.enabled }}

{{- /* Scan the peer list once: which tiers are in play, what the backend tier's
       per-instance concurrency is (the multiplier for a cart peer's
       maxConcurrencyFromBackend), and the top priority in use (what an injected
       cart peer has to beat). */}}
{{- $usesCart := false }}
{{- $ccFromBackend := false }}
{{- $backendCC := 0 }}
{{- $topPriority := 0 }}
{{- range $mr.nginx.peers }}
  {{- $topPriority = max $topPriority (.priority | default 0 | int) }}
  {{- if eq (.use | toString) "cart" }}
    {{- $usesCart = true }}
    {{- if .maxConcurrencyFromBackend }}{{ $ccFromBackend = true }}{{ end }}
  {{- else if eq (.use | toString) "backend" }}
    {{- $backendCC = max $backendCC (.maxConcurrency | default 0 | int) }}
  {{- end }}
{{- end }}

{{- /* Put the CART in front of the peer list. Nobody has to restate the tier
       here for the same reason nobody restates the Service in discovery: with a
       CART in the route, routing to it IS the point, and a peers list that
       forgot to mention it is a silent no-op rather than an error.

       Priority is one above whatever is already there, so the CART leads no
       matter how the tiers below were numbered, and traffic still cascades to
       them when it is banned.

       maxConcurrencyFromBackend sizes the CART's limit as (per-backend
       concurrency x backend count), so it tracks scaling instead of being pinned
       to a stale number -- but it needs a backend tier carrying maxConcurrency
       as the multiplier. Without one, the peer is injected with no limit of its
       own and falls back to nginx.values.default_max, rather than being injected
       into a state the validation below rejects.

       Writing a `- use: cart` peer explicitly turns all of this off: the list is
       then taken exactly as authored. */}}
{{- $peers := $mr.nginx.peers }}
{{- if and $cartOn (not $usesCart) }}
  {{- $cartPeer := dict "use" "cart" "priority" (add1 $topPriority) }}
  {{- if gt (int $backendCC) 0 }}
    {{- $cartPeer = set $cartPeer "maxConcurrencyFromBackend" true }}
  {{- end }}
  {{- $peers = prepend $peers $cartPeer }}
{{- end }}

{{- /* Where that CART is, on the same terms as discovery above: not configurable,
       because the chart already knows the names it generated and a restated name
       is only an opportunity to drift.

       The names come from the subchart's own helpers rather than being
       reassembled here, which is what makes that hold -- set
       cart.fullnameOverride and this follows. Those helpers read .Values, .Chart
       and .Release, so they are handed the subchart's slice of the values tree
       instead of this chart's context. That slice only carries the subchart's
       defaults while the subchart is enabled, and a disabled subchart takes its
       _helpers.tpl out of the chart tree with it -- so these may only ever be
       evaluated under $cartOn, which is exactly what cart.enabled gates. */}}
{{- $sub := dict "Values" .Values.cart "Chart" (dict "Name" "cart") "Release" .Release }}

{{- if not $mr.nginx.outputConfigMap }}
{{- fail "sglang: modelRoute.nginx.outputConfigMap is required -- it names the ConfigMap autoconfig writes this route into (\"ns/name\", e.g. llm-route/openresty-conf). The chart cannot guess where your openresty lives" }}
{{- end }}
{{- if not $mr.nginx.peers }}
{{- fail "sglang: modelRoute.nginx.peers must hold at least one peer group (the CRD requires minItems: 1); the simplest is a single `- use: backend`" }}
{{- end }}
{{- if and $usesCart (not $cartOn) }}
{{- fail "sglang: modelRoute.nginx.peers routes to `use: cart`, but no CART is in this route, so the rendered spec would have no cart block for that peer to point at. Set cart.enabled, or drop the cart peer -- and note that with cart.enabled the peer is added for you, so writing one by hand is only for pinning its priority or concurrency" }}
{{- end }}
{{- if and $ccFromBackend (le (int $backendCC) 0) }}
{{- fail "sglang: modelRoute.nginx.peers has a cart peer with maxConcurrencyFromBackend, which sizes CART's limit as (per-backend concurrency x backend count) -- that needs a `use: backend` peer carrying maxConcurrency > 0 as the multiplier. Add one, or drop maxConcurrencyFromBackend and set a static maxConcurrency on the cart peer" }}
{{- end }}
{{- if and $mr.monitor.enabled (not $mr.monitor.outputConfigMap) }}
{{- fail "sglang: modelRoute.monitor.outputConfigMap is required when modelRoute.monitor.enabled -- it is the ConfigMap monitor reads (\"ns/name\", shared across models, one key per model)" }}
{{- end }}
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: {{ $mr.name | default .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-sglang
  {{- with $mr.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  finalizers:
    - routing.gpucluster.io/cleanup
spec:
  # The backend bucket: what feeds CART's workers, nginx's backend peers and
  # monitor's service rows. Always this release's own Service, so a scale event
  # is all it takes for every route to follow.
  discovery:
    service: {{ $ownSvc | quote }}
    # Emitted rather than left to autoconfig's auto-derivation: the chart already
    # knows the port, and a fixed value keeps working if a second port is ever
    # added to the Service (auto-derivation only handles the single-port case).
    port: {{ .Values.service.port }}
    {{- if $mr.discovery.includeNotReady }}
    includeNotReady: true
    {{- end }}
  {{- if $cartOn }}
  # Cache-aware router for THIS model, deployed by this release. CART is
  # per-model by nature -- prefix affinity is only meaningful within one model --
  # so it is never shared, and two ModelRoutes never name the same one.
  cart:
    service: {{ printf "%s/%s" .Release.Namespace (include "cart.fullname" $sub) | quote }}
    # Emitted rather than left to autoconfig's auto-derivation, for the same
    # reason as discovery.port above.
    port: {{ .Values.cart.service.port }}
    outputConfigMap: {{ printf "%s/%s" .Release.Namespace (include "cart.configMapName" $sub) | quote }}
    {{- with include "cart.autoconfigKey" $sub }}
    outputKey: {{ . | quote }}
    {{- end }}
    {{- with $mr.cart.maxLoad }}
    maxLoad: {{ . }}
    {{- end }}
  {{- end }}
  nginx:
    {{- with $mr.nginx.route }}
    route: {{ . | quote }}
    {{- else }}
    # route omitted: autoconfig derives it from metadata.name above. That name is
    # already an RFC 1123 name, so it always satisfies the route charset
    # ([a-z0-9._-]) that dispatch's path regex depends on.
    {{- end }}
    outputConfigMap: {{ $mr.nginx.outputConfigMap | quote }}
    {{- if $mr.nginx.service }}
    service: {{ $mr.nginx.service | quote }}
    {{- else if $mr.nginx.selector }}
    selector: {{ $mr.nginx.selector | quote }}
    {{- end }}
    {{- with $mr.nginx.values }}
    # Rendered verbatim into openresty's lua route table, so new tuning knobs
    # need no chart change. Quoted because the CRD types them as strings.
    values:
      {{- range $k, $v := . }}
      {{ $k }}: {{ $v | quote }}
      {{- end }}
    {{- end }}
    # Ordered peer groups; higher priority wins, and traffic only cascades to a
    # lower tier once every peer above it is banned. A cart tier at the top is
    # added by the chart whenever the route has a CART and the list does not
    # already name one.
    peers:
      {{- toYaml $peers | nindent 6 }}
  {{- with $sloName }}
  slo:
    name: {{ . | quote }}
  {{- end }}
  {{- if $mr.monitor.enabled }}
  monitor:
    outputConfigMap: {{ $mr.monitor.outputConfigMap | quote }}
    # Defaults to serviceId
    model: {{ $mr.monitor.model | default (include "sglang.serviceId" .) | quote }}
    {{- with $mr.monitor.gpuType }}
    gpuType: {{ . | quote }}
    {{- end }}
    {{- if kindIs "bool" $mr.monitor.nginx }}
    nginx: {{ $mr.monitor.nginx }}
    {{- end }}
    {{- if kindIs "bool" $mr.monitor.router }}
    router: {{ $mr.monitor.router }}
    {{- end }}
  {{- end }}
{{- end -}}
