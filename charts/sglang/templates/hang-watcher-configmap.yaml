{{- if .Values.hangWatcher.enabled }}
# Thresholds for the hang-watcher sidecar, mounted at /etc/hang-watcher. The
# sidecar hot-reloads this on mtime change, so `helm upgrade` retunes it in place
# without a pod restart. Keys are the sidecar's own (snake_case); values come
# from hangWatcher.config in values.yaml.
#
# log_file is NOT here: it has to be built from the downward API (this pod's own
# name/namespace), which a ConfigMap cannot do, so it goes in as an env var on the
# sidecar instead. The two log_* keys below are only emitted when logHang is on --
# the sidecar ignores them without a log file anyway, but leaving them out keeps
# "is the fast path armed?" answerable by reading the ConfigMap alone.
{{- $c := .Values.hangWatcher.config }}
{{- /* `helm upgrade --reuse-values` reuses the previous USER-SUPPLIED values and
       does not fill in keys the new chart added. Any release that set
       hangWatcher.config.* itself therefore upgrades with $c.logHang == nil,
       which fails the whole upgrade with
       `nil pointer evaluating interface{}.enabled`. Do not rely on callers
       remembering --reset-then-reuse-values; the template defends itself. */}}
{{- $logHang := $c.logHang | default dict }}
{{- /* The whole point of logHang is to decide EARLIER when a second signal is
       available. If its stallSec is not below the outer stallSec, the fast path
       can never fire before the ordinary one -- configured but inert, with
       nothing to say so (the schema only checks minimum: 1, and two equal values
       look perfectly legal). That silent no-op is far harder to find than an
       error, so it is rejected at render time.
       Seen in practice: the outer stallSec was lowered from 60 to 30 and
       logHang.stallSec was left at 30, disabling the fast path unnoticed. */}}
{{- if $logHang.enabled }}
{{- $ls := int ($logHang.stallSec | default 15) }}
{{- $ss := int ($c.stallSec | default 30) }}
{{- if ge $ls $ss }}
{{- fail (printf "sglang: hangWatcher.config.logHang.stallSec (%d) must be below hangWatcher.config.stallSec (%d). Firing EARLIER is the whole point of the log fast path; at or past the main threshold it can never fire first, so enabling it would be a silent no-op. Lower it, or set logHang.enabled=false" $ls $ss) }}
{{- end }}
{{- end }}
{{- /* Default the probe body to a 1-token /v1/completions for this model when it
       is left empty and the method is POST. GET probes (e.g. /health_generate)
       keep an empty body. */}}
{{- $body := $c.activeProbeBody }}
{{- if and (not $body) (eq (upper ($c.activeProbeMethod | default "GET")) "POST") }}
{{- $body = printf `{"model":"%s","prompt":"ping","max_tokens":1,"stream":false}` (include "sglang.servedModelName" .) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-hang-watcher
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-sglang
data:
  config.json: |
    {
      {{- /* Every field carries a default for the same reason: under
             --reuse-values, $c may hold only the keys the user wrote, and a
             missing one renders as nothing -> `"poll_interval_sec": ,`, which is
             invalid JSON. The sidecar does not crash on that; it silently falls
             back to its own built-in defaults, so the stall_sec configured here
             quietly stops applying. Harder to notice than an error, hence the
             duplicated defaults. */}}
      "poll_interval_sec": {{ $c.pollIntervalSec | default 15 }},
      "stall_sec": {{ $c.stallSec | default 60 }},
      "metrics_timeout_sec": {{ $c.metricsTimeoutSec | default 10 }},
      "warmup_sec": {{ $c.warmupSec | default 600 }},
      "active_probe_enabled": {{ $c.activeProbeEnabled | default false }},
      "active_probe_path": {{ $c.activeProbePath | default "/health_generate" | quote }},
      "active_probe_method": {{ $c.activeProbeMethod | default "GET" | quote }},
      "active_probe_body": {{ $body | toJson }},
      "active_probe_timeout_sec": {{ $c.activeProbeTimeoutSec | default 25 }}{{ if $logHang.enabled }},
      "log_stall_sec": {{ $logHang.stallSec | default 30 }},
      "log_window_sec": {{ $logHang.windowSec | default 120 }}{{ end }}
    }
{{- end }}
