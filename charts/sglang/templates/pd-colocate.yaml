{{- /* Shape C: the colocate form of pd -- ONE Deployment whose pod carries BOTH
       engines as containers on a single node, sharing one netns and that node's
       GPUs, with the router as a third container on the same pod. No
       DisaggregatedSet, no LeaderWorkerSet, no per-slice headless Services: the
       router reaches its engines over loopback, because they live beside it.

       replicaCount is ordinary Deployment replicas: N self-contained
       appliances, each its own router's front door. That keeps every shape on
       the same port table (see values.yaml) -- the public router on
       service.port, the engines on pd.<role>.httpPort -- so the front door
       below and whatever fronts it (CART, ModelRoute, monitor) need no
       colocate awareness.

       The two engine containers come from the SAME sglang.engineContainers the
       DisaggregatedSet and one-engine pods use, with colocate=true so the
       decode side takes the offset identity (its own container name and
       hang-watcher; its port is named for its role, like every other shape's).
       The pod scaffold around them -- model volume, /dev/shm,
       scheduling, hang-watcher config -- is shared with every other shape, so
       a colocate pod cannot drift from a DS pod on the parts that matter. */ -}}
{{- if and .Values.pd.enabled .Values.pd.colocate -}}
{{- include "sglang.shutdownBudget" . }}
{{- $root := . }}
{{- $pd := .Values.pd }}
{{- $fullname := include "sglang.fullname" . }}
{{- $hasModel := ne (toString (.Values.model.localPath | default "")) "" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-sglang
spec:
  replicas: {{ $root.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $root.Release.Name }}-sglang
  {{- with $root.Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $root.Values.progressDeadlineSeconds }}
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with $root.Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        app: {{ $root.Release.Name }}-sglang
        {{- with (include "sglang.podLabels" $root) }}
        {{- . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      {{- if $root.Values.modelCheck.enabled }}
      initContainers:
      # Refuse to start the engine unless the mounted model directory actually
      # holds a model. hostPathType already rejects a missing path; this covers
      # an empty or half-copied one. Reuses the engine image so no extra image
      # has to be pulled, and takes no GPU.
      - name: model-check
        image: "{{ $root.Values.image.repository }}:{{ $root.Values.image.tag }}"
        command:
          - /bin/sh
          - -c
          - |
            DIR={{ $root.Values.model.mountPath | quote }}
            if [ ! -d "$DIR" ]; then
              echo "model-check: $DIR is not a directory" >&2
              exit 1
            fi
            if [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
              echo "model-check: $DIR is empty -- is {{ $root.Values.model.localPath }} populated on this node?" >&2
              exit 1
            fi
            {{- range $root.Values.modelCheck.requiredGlobs }}
            if [ -z "$(find "$DIR" -maxdepth 1 -name {{ . | quote }} -print -quit)" ]; then
              echo "model-check: no {{ . }} directly under $DIR -- looks like an incomplete model" >&2
              exit 1
            fi
            {{- end }}
            echo "model-check: $DIR looks like a model directory"
        volumeMounts:
        - name: model-storage
          mountPath: {{ $root.Values.model.mountPath }}
          readOnly: true
      {{- end }}
      containers:
      # Prefill engine (identity "prefill-leader": single instance, no group).
      {{- include "sglang.engineContainers" (dict "root" $root "role" "prefill-leader" "roleCfg" $pd.prefill "colocate" true) | nindent 6 }}
      # Decode engine (identity "decode-leader"; colocate=true gives it the
      # offset container name / hang-watcher so the two engines do not collide
      # inside the one pod; each engine's port is named for its role).
      {{- include "sglang.engineContainers" (dict "root" $root "role" "decode-leader" "roleCfg" $pd.decode "colocate" true) | nindent 6 }}
      # Router on loopback: its two engines are the containers beside it, so
      # there is no headless Service to resolve -- 127.0.0.1 reaches them
      # directly. One per pod, the pod's front door. The bootstrap port is
      # handed to --prefill explicitly, exactly as in pd-ds.yaml, never let to
      # smg's default (which would trap the decode side onto its own port).
      - name: router
        {{- $img := $pd.router.imageOverride | default dict }}
        image: "{{ $img.repository | default $root.Values.image.repository }}:{{ $img.tag | default $root.Values.image.tag }}"
        command: ["bash", "-lc"]
        args:
        - |
          set -e
          exec python3 -m sglang_router.launch_router \
            --pd-disaggregation \
            --prefill http://127.0.0.1:{{ $pd.prefill.httpPort | default 30001 }} {{ $pd.prefill.bootstrapPort | default 8998 }} \
            --decode http://127.0.0.1:{{ $pd.decode.httpPort | default 30002 }} \
            --policy {{ $pd.router.policy | default "cache_aware" }} \
            --model-path {{ $root.Values.model.mountPath }} \
            --host 0.0.0.0 \
            --port {{ $root.Values.service.port }}
        {{- /* Same readiness chain as the A/B router; hosts are loopback
               because the engines share this pod's netns. The pod is Ready
               only when prefill AND decode each answer /health AND this
               router is running -- the Service's front door opens then,
               not earlier. See sglang.pdRouterProbes. */ -}}
        {{- include "sglang.pdRouterProbes" (dict "roles" (dict
             "prefill" (dict "host" "127.0.0.1" "port" ($pd.prefill.httpPort | default 30001))
             "decode"  (dict "host" "127.0.0.1" "port" ($pd.decode.httpPort  | default 30002)))) | nindent 8 }}
        # Port name is router-http, NOT http: the prefill engine in this same
        # pod already names its port http-prefill (and decode http-decode), and
        # the API server warns on a duplicate name within one pod. The front-door Service
        # targets this port numerically (service.port), so the name carries no
        # routing weight -- it only has to be distinct inside the netns.
        ports:
        - { containerPort: {{ $root.Values.service.port }}, name: router-http }
        env:
        {{- include "sglang.mergeEnv" (dict "chart" list "user" $root.Values.env "padding" 8) }}
        {{- if $hasModel }}
        volumeMounts:
        - name: model-storage
          mountPath: {{ $root.Values.model.mountPath }}
          readOnly: true
        {{- end }}
      volumes:
      {{- if $hasModel }}
      - name: model-storage
        hostPath:
          path: {{ $root.Values.model.localPath }}
          type: {{ $root.Values.model.hostPathType }}
      {{- end }}
      {{- /* The colocate engines come from sglang.engineContainers, which mounts
             the cache-manager volumes when cache.enabled -- the volumes have to
             exist on this pod too. Same shape as sglang.podSpec. */}}
      {{- $cache := $root.Values.cache | default dict }}
      {{- /* commandOverride owns the command line, so cache.enabled stays off --
             same rule as sglang.engineIdentity. */}}
      {{- $cacheEnabled := and ($cache.enabled | default false) (kindIs "invalid" $root.Values.commandOverride) }}
      {{- if $cacheEnabled }}
      {{- $cacheSuffix := ternary $cache.hostPathSuffix (include "sglang.cacheModelDir" $root) (not (kindIs "invalid" $cache.hostPathSuffix)) }}
      {{- $cacheBaseHostPath := $cache.hostPath | default "/mnt/disk0/sglang-cache" | trimSuffix "/" }}
      {{- $cacheFullHostPath := ternary (printf "%s/%s" $cacheBaseHostPath $cacheSuffix) $cacheBaseHostPath (ne (toString $cacheSuffix) "") }}
      - name: host-cache
        hostPath:
          path: {{ $cacheFullHostPath }}
          type: DirectoryOrCreate
      - name: cache-manager-script
        configMap:
          name: {{ $fullname }}-cache-manager
          defaultMode: 0755
      {{- end }}
      {{- /* /dev/shm, sized for the two engines' multiproc IPC (see values.yaml
             under shm). The chart mounts one unless a values file already
             mounts /dev/shm for itself; that also keeps the name from
             colliding with a user volume of the same name. */}}
      {{- $userShm := false }}
      {{- range $root.Values.volumeMounts }}
      {{- if eq (.mountPath | default "") "/dev/shm" }}{{ $userShm = true }}{{ end }}
      {{- end }}
      {{- if and $root.Values.shm.enabled (not $userShm) }}
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: {{ $root.Values.shm.sizeLimit }}
      {{- end }}
      {{- if $root.Values.hangWatcher.enabled }}
      - name: hang-watcher-config
        configMap:
          name: {{ $root.Release.Name }}-hang-watcher
      {{- if (($root.Values.hangWatcher.config).logHang | default dict).enabled }}
      - name: pod-logs
        hostPath:
          path: /var/log/pods
          type: Directory
      {{- end }}
      {{- end }}
      {{- with $root.Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if $root.Values.hostNetwork }}
      hostNetwork: true
      {{- end }}
      {{- with (ternary "ClusterFirstWithHostNet" $root.Values.dnsPolicy (and $root.Values.hostNetwork (not $root.Values.dnsPolicy))) }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with $root.Values.schedulerName }}
      schedulerName: {{ . }}
      {{- end }}
      {{- with $root.Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Same auto-add as sglang.podSpec: tolerate the accelerator taint so
             the engine pod is schedulable on its own tainted nodes. A user
             entry for the same key wins (Helm replaces lists, so a values
             file that sets `tolerations` would otherwise silently lose this). */}}
      {{- $tols := default (list) $root.Values.tolerations }}
      {{- $hasGpuTol := false }}
      {{- range $tols }}
      {{- if eq (.key | default "") "nvidia.com/gpu" }}{{- $hasGpuTol = true }}{{- end }}
      {{- end }}
      {{- if not $hasGpuTol }}
      {{- $tols = concat (list (dict "key" "nvidia.com/gpu" "operator" "Exists" "effect" "NoSchedule")) $tols }}
      {{- end }}
      {{- with $tols }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- /* Without these, the merged pod's engines are unreachable to Prometheus:
       the only Service covering a colocate release is service.yaml, which
       points at the router's port, and the router serves no /metrics.

       One headless Service per role fixes it without a new mechanism: the same
       <fullname>-<role>-hl-s<N> naming and the same port names the
       DisaggregatedSet shape publishes, so a single ServiceMonitor covers both
       shapes and the dashboards need no colocate case -- they strip that suffix
       to recover the release name either way. Both Services select the same pod
       and differ only in which container port they expose.

  targetPort names the role, matching the container port that sglang.engineContainers
  declares for that side (see $pname in _pod.tpl). The two engines share a pod,
  so their port names must differ; naming them by role rather than suffixing one
  of them means the Service, the container and the ServiceMonitor all say the
  same word.

       Slice is fixed at 0. Colocate has no slices -- replicaCount scales whole
       appliances -- but keeping the suffix is what lets one naming rule serve
       both shapes. */}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-prefill-hl-s0
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-sglang
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: {{ $root.Release.Name }}-sglang
  ports:
  - { name: http-prefill, port: {{ $pd.prefill.httpPort | default 30001 }}, targetPort: http-prefill }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-decode-hl-s0
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-sglang
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: {{ $root.Release.Name }}-sglang
  ports:
  - { name: http-decode, port: {{ $pd.decode.httpPort | default 30002 }}, targetPort: http-decode }
{{- end -}}
{{- /* The front door every colocate appliance sits behind is service.yaml: it
       selects the merged pods by their app label and exposes service.port --
       the router container's listen port -- exactly as it does the
       single-engine Deployment's, so CART, the ModelRoute and the monitor keep
       working without pd awareness. */}}
