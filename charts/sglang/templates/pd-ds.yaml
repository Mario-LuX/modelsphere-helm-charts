{{- /* Shapes A and B: the DisaggregatedSet form of pd -- separate prefill and
       decode roles over IB, one router per slice (replicaCount = spec.slices).
       Colocate is a merged Deployment instead; see pd-colocate.yaml.

       The two roles render one leaderWorkerTemplate each from the SAME engine
       pod builder the non-pd roles use (_pod.tpl), so image, model volume,
       resources and scheduling cannot drift between roles or away from the
       single-node/LWS forms. A role's size reuses the lws grouping axis: 1 = one
       pod per engine, >=2 = a multi-node group per engine. */ -}}
{{- if and .Values.pd.enabled (not .Values.pd.colocate) -}}
{{- include "sglang.shutdownBudget" . }}
{{- $root := . }}
{{- $lws := .Values.lws }}
{{- $pd := .Values.pd }}
{{- $fullname := include "sglang.fullname" . }}
{{- /* slice count = replicaCount: N independent copies of the whole role pair,
       each with its own router. */}}
{{- $slices := int .Values.replicaCount }}
apiVersion: disaggregatedset.x-k8s.io/v1
kind: DisaggregatedSet
metadata:
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-sglang
spec:
  slices: {{ $slices }}
  roles:
  {{- /* Each entry: the role name (which becomes the --disaggregation-mode and
         the DS role label), the values block (replicas/size/httpPort/bootstrapPort/
         distPort/extraArgs/affinityReplace/schedulerName/gpus), and the engine's
         http port read back so the role's headless Service below points at the
         right one. */}}
  {{- range $roleName, $roleCfg := dict "prefill" $pd.prefill "decode" $pd.decode }}
  - name: {{ $roleName }}
    metadata:
      labels:
        app: {{ $root.Release.Name }}-sglang
        role: {{ $roleName }}
    spec:
      replicas: {{ $roleCfg.replicas }}
      startupPolicy: {{ $lws.startupPolicy }}
      networkConfig:
        subdomainPolicy: {{ $lws.subdomainPolicy }}
      {{- /* PD upgrades default to atomic per role: the whole xPyD set is one
             service, and "keep traffic running during an upgrade" is a property
             of the tier above (multiple slices / releases draining through the
             front door), not of the engine fleet itself. Surge 0 frees the old
             groups' GPUs before the new ones schedule (full cluster friendly);
             unavailable = the role's group count makes the controller delete
             every old group at once and only then create the new set. A user
             lws.rolloutStrategy still wins when set -- most pd values files
             never touch it, so the default is what they'll see. */}}
      {{- /* PD upgrades default to atomic per role: the whole xPyD set is one
             service, HA lives at the tier above (slices / releases draining
             through the front door), not the engine fleet. Surge 0 keeps a
             full cluster schedulable; unavailable = the role's group count
             makes the controller delete every old group at once. pd-owned
             knob (pd.rolloutStrategy, not lws.rolloutStrategy): the chart
             itself sets lws.rolloutStrategy, so inheriting it would make this
             default dead in every render. A user pd.rolloutStrategy wins. */}}
      {{- with ($pd.rolloutStrategy | default (dict "type" "RollingUpdate" "rollingUpdateConfiguration" (dict "maxSurge" 0 "maxUnavailable" $roleCfg.replicas))) }}
      rolloutStrategy:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      leaderWorkerTemplate:
        size: {{ $roleCfg.size | default 1 }}
        restartPolicy: {{ $lws.restartPolicy }}
        leaderTemplate:
          metadata:
            labels:
              app: {{ $root.Release.Name }}-sglang
              role: {{ $roleName }}
              {{- with (include "sglang.podLabels" $root) }}
              {{- . | nindent 14 }}
              {{- end }}
          spec:
            {{- include "sglang.podSpec" (dict "root" $root "role" (printf "%s-leader" $roleName) "roleCfg" $roleCfg) | nindent 12 }}
        workerTemplate:
          metadata:
            labels:
              app: {{ $root.Release.Name }}-sglang
              role: {{ $roleName }}
              {{- with (include "sglang.podLabels" $root) }}
              {{- . | nindent 14 }}
              {{- end }}
          spec:
            {{- include "sglang.podSpec" (dict "root" $root "role" (printf "%s-worker" $roleName) "roleCfg" $roleCfg) | nindent 12 }}
  {{- end }}
{{- /* Per-slice headless Services (one per role per slice) and a per-slice
       router. The selector keys off the disaggregatedset.x-k8s.io
       name/role/slice labels, which the DS controller injects into BOTH pod
       templates of every per-(role, slice) LWS it creates
       (LeaderWorkerSetManager.Create merges GenerateLabels into
       LeaderTemplate/WorkerTemplate). worker-index: "0" selects the group
       leaders only -- the only pods serving HTTP. The chart's own `app` label
       cannot be used as the selector key here because the LWS controller
       re-derives it as "<ds-name>-<role>". publishNotReadyAddresses lets the
       router resolve upstreams while the engines are still loading. */}}
{{- range $s := until $slices }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-prefill-hl-s{{ $s }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-sglang
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    disaggregatedset.x-k8s.io/name: {{ $fullname }}
    disaggregatedset.x-k8s.io/role: prefill
    disaggregatedset.x-k8s.io/slice: "{{ $s }}"
    leaderworkerset.sigs.k8s.io/worker-index: "0"
  ports:
  - { name: http-prefill, port: {{ $pd.prefill.httpPort | default 30001 }}, targetPort: http-prefill }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-decode-hl-s{{ $s }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-sglang
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    disaggregatedset.x-k8s.io/name: {{ $fullname }}
    disaggregatedset.x-k8s.io/role: decode
    disaggregatedset.x-k8s.io/slice: "{{ $s }}"
    leaderworkerset.sigs.k8s.io/worker-index: "0"
  ports:
  - { name: http-decode, port: {{ $pd.decode.httpPort | default 30002 }}, targetPort: http-decode }
---
# Router for slice {{ $s }}: resolves this slice's two headless Services into
# repeated --prefill / --decode flags, so the router sees every group leader of
# THIS slice. One router per slice is the PD unit's front door.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-router-s{{ $s }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $root.Release.Name }}-sglang
spec:
  replicas: {{ $pd.router.replicas | default 1 }}
  # Reuse the top-level value: the router pod's "no progress" window now has to
  # cover the engine placement window too, because its init container blocks
  # on the engines being scheduled. The default 7200 (hours) is the natural
  # ceiling for a GPU autoscaler leg anyway.
  progressDeadlineSeconds: {{ pluck "progressDeadlineSeconds" $root.Values $pd.router | first | default $root.Values.progressDeadlineSeconds | default 7200 }}
  selector:
    matchLabels:
      app: {{ $root.Release.Name }}-sglang
      component: router
      slice: "{{ $s }}"
  template:
    metadata:
      labels:
        app: {{ $root.Release.Name }}-sglang
        component: router
        slice: "{{ $s }}"
    spec:
      # The router's own budget, NOT the engines'. 30s was sized for a front-end
      # that answers short-lived HTTP; the pd router holds long-lived streams
      # back to prefill and decode, and a hard SIGKILL mid-request leaves the
      # client facing an aborted stream and the peer engines holding half-
      # finished KV state. 600s gives in-flight requests and router-side
      # cancellation propagation a real window; the pod is not GPU-bearing, so
      # holding it longer costs only node bookkeeping.
      terminationGracePeriodSeconds: 600
      {{- /* Placement gates init, not the router's boot script. An init
             container can wait unbounded (no probes, no budget tension), and
             while it runs kubectl shows Init:0/1 -- "never scheduled" is a
             visible state, not a crashloop after a fuse. There is deliberately
             NO timeout here: "insufficient resources" is indistinguishable
             from "placement completes in an hour" from inside the pod, so the
             loop just blocks until the full set shows up. */}}
      initContainers:
      - name: wait-upstreams
        {{- $img := $pd.router.imageOverride | default dict }}
        image: "{{ $img.repository | default $root.Values.image.repository }}:{{ $img.tag | default $root.Values.image.tag }}"
        command: ["bash", "-lc"]
        args:
        - |
          set -e
          PF_HL={{ $fullname }}-prefill-hl-s{{ $s }}.{{ $root.Release.Namespace }}.svc.cluster.local.
          DC_HL={{ $fullname }}-decode-hl-s{{ $s }}.{{ $root.Release.Namespace }}.svc.cluster.local.
          PF_WANT={{ $pd.prefill.replicas }}
          DC_WANT={{ $pd.decode.replicas }}
          n=1
          while :; do
            PF_HAVE=$(getent hosts "$PF_HL" | awk '{print $1}' | sort -u | wc -l)
            DC_HAVE=$(getent hosts "$DC_HL" | awk '{print $1}' | sort -u | wc -l)
            [ "$PF_HAVE" -ge "$PF_WANT" ] && [ "$DC_HAVE" -ge "$DC_WANT" ] && exit 0
            echo "wait-upstreams: slice {{ $s }} not fully placed (prefill $PF_HAVE/$PF_WANT, decode $DC_HAVE/$DC_WANT; attempt $n)"
            n=$((n+1))
            sleep 5
          done
      containers:
      - name: router
        image: "{{ $img.repository | default $root.Values.image.repository }}:{{ $img.tag | default $root.Values.image.tag }}"
        command: ["bash", "-lc"]
        args:
        - |
          set -e
          # Resolve this slice's headless Services into a list of group-leader
          # IPs, then build repeated --prefill / --decode flags. getent prints
          # one line per backing pod for a headless Service. The bootstrap port
          # is handed to --prefill explicitly -- never let smg default it (the
          # decode side would connect back to its own port).
          #
          # First-boot FULL placement is the init container's job; by the time
          # this script runs, the full set has been placed at least once. On a
          # router CONTAINER restart (drift liveness, OOM) the goal changes:
          # get back to serving ASAP with whatever is placed now. So this loop
          # does NOT count toward the full set -- it only refuses to exec with
          # an EMPTY role list, which would be a router that can never route.
          # Mid-life engine shrinkage is fine: argv keeps dead IPs and the
          # router quarantines them itself, and growth is picked up by the
          # drift liveness probe's restart. publishNotReadyAddresses is what
          # makes placement observable at all -- the address appears as soon as
          # the pod has an IP, so this sees scheduled engines, not just Ready
          # ones.
          PF_HL={{ $fullname }}-prefill-hl-s{{ $s }}.{{ $root.Release.Namespace }}.svc.cluster.local.
          DC_HL={{ $fullname }}-decode-hl-s{{ $s }}.{{ $root.Release.Namespace }}.svc.cluster.local.
          for i in $(seq 1 60); do
            PF_IPS=$(getent hosts "$PF_HL" | awk '{print $1}' | sort -u)
            DC_IPS=$(getent hosts "$DC_HL" | awk '{print $1}' | sort -u)
            [ -n "$PF_IPS" ] && [ -n "$DC_IPS" ] && break
            echo "router: slice {{ $s }} upstreams not yet resolving (prefill: '${PF_IPS:-none}', decode: '${DC_IPS:-none}'; attempt $i)"
            sleep 5
          done
          if [ -z "$PF_IPS" ] || [ -z "$DC_IPS" ]; then
            echo "router: timed out waiting for slice {{ $s }} upstreams to resolve: prefill '${PF_IPS:-none}', decode '${DC_IPS:-none}'" >&2
            exit 1
          fi
          PF_ARGS=""
          for ip in $PF_IPS; do PF_ARGS="$PF_ARGS --prefill http://$ip:{{ $pd.prefill.httpPort | default 30001 }} {{ $pd.prefill.bootstrapPort | default 8998 }}"; done
          DC_ARGS=""
          for ip in $DC_IPS; do DC_ARGS="$DC_ARGS --decode http://$ip:{{ $pd.decode.httpPort | default 30002 }}"; done
          echo "router: prefill$PF_ARGS"
          echo "router: decode $DC_ARGS"
          # Persist the boot-time upstream set for the liveness drift probe.
          # Router argv is immutable for the life of the process, so the file
          # is the probe's only handle on "what upstreams were baked in".
          #
          # Each line is "<ip>|<restarts>|<watcher_started_at>" from the
          # engine pod's hang-watcher /engine endpoint. The ip alone isn't a
          # stable identity: sglang-router pins bootstrap info at boot on
          # TOP of the IP, so an engine that crashes and is restarted in place
          # by the kubelet keeps its IP but swaps engine_id -- the router's
          # transfer sessions then point at a dead incarnation while DNS
          # shows nothing new. Comparing (restarts, watcher_started_at) is
          # version-agnostic: any hang-watcher that exposes /engine yields a
          # fresh tuple for every engine process replacement.
          #
          # HW_PORT=0 is the "sidecar disabled at render time" sentinel and
          # behaves identically to the older-sidecar 404: record "<ip>||" and
          # move on, the runtime probe treats both as "no identity info".
          # 503 = sidecar alive but engine id not yet pinned; retry up to
          # 90min, then give up and record the same sentinel (fail-open:
          # identity unknown is not a reason to keep the router from ever
          # booting). engine not yet listening (conn refused) and CoreDNS
          # slop (timeout) also retry on the same budget.
          HW_PORT={{ ternary (int $root.Values.hangWatcher.port) 0 $root.Values.hangWatcher.enabled }}
          probe_identity() {
            local ip=$1 budget=${2:-5400} waited=0
            [ "$HW_PORT" -eq 0 ] && { echo '|'; return 0; }
            while :; do
              local out
              # python3 heredoc: body and terminator sit at the block scalar's
              # own indent, so the rendered yaml strips them to column 0 for
              # bash+python. Exit 0 prints '<restarts>|<ts>' on 200 or '|' on
              # 404 sentinel; exit 2 on 503 / conn refused / timeout / bad
              # json = transient, caller retries on its own budget.
              out=$(python3 - "$ip" "$HW_PORT" <<'PY' 2>/dev/null
          import json, sys, urllib.request, urllib.error
          ip, port = sys.argv[1], sys.argv[2]
          try:
              r = urllib.request.urlopen(f"http://{ip}:{port}/engine", timeout=5)
              j = json.loads(r.read())
              print(f"{j['restarts']}|{j['watcher_started_at']}")
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  print('|')
              else:
                  sys.exit(2)
          except Exception:
              sys.exit(2)
          PY
          )
              local rrc=$?
              if [ $rrc -eq 0 ]; then echo "$out"; return 0; fi
              if [ $waited -ge $budget ]; then
                echo "router: $ip identity probe gave no usable answer after ${budget}s; recording ip||" >&2
                echo '|'; return 0
              fi
              sleep 10; waited=$((waited+10))
            done
          }
          install -d -m 0755 /run/pd-router
          write_role_snapshot() {
            local role=$1 ips=$2
            local T=$(mktemp -p /run/pd-router)
            local ip id
            for ip in $ips; do
              id=$(probe_identity "$ip")
              printf '%s|%s\n' "$ip" "$id" >>"$T"
            done
            mv "$T" "/run/pd-router/${role}-ips"
          }
          write_role_snapshot prefill "$PF_IPS"
          write_role_snapshot decode  "$DC_IPS"
          # shellcheck disable=SC2086
          exec python3 -m sglang_router.launch_router \
            --pd-disaggregation \
            $PF_ARGS $DC_ARGS \
            --policy {{ $pd.router.policy | default "cache_aware" }} \
            --model-path {{ $root.Values.model.mountPath }} \
            --host 0.0.0.0 \
            --port {{ $root.Values.service.port }}
        {{- /* The router's only read of "am I useful" is answering "is at
               least one engine of each role taking HTTP behind me". exec to
               avoid depending on the router's own /health (which cannot see
               dead upstreams). /health on the engines, not /health_generate:
               the deep signal is already owned by the engines' own probes,
               and doubling it here would halve scheduler capacity for no
               signal. startupProbe carries the engines' 90-minute load
               budget so this pod isn't liveness-killed while engines load.
               See sglang.pdRouterProbes. */ -}}
        {{- include "sglang.pdRouterProbes" (dict "roles" (dict
             "prefill" (dict "host" (printf "%s-prefill-hl-s%d.%s.svc.cluster.local." $fullname $s $root.Release.Namespace) "port" ($pd.prefill.httpPort | default 30001))
             "decode"  (dict "host" (printf "%s-decode-hl-s%d.%s.svc.cluster.local."  $fullname $s $root.Release.Namespace) "port" ($pd.decode.httpPort  | default 30002)))) | nindent 8 }}
        {{- /* Drift liveness: restart the router if a new prefill/decode IP
               appears in DNS after boot -- argv is immutable and the running
               router can never learn about post-boot upstreams. */}}
        {{- include "sglang.pdRouterLivenessProbe" (dict "root" $root "roles" (dict
             "prefill" (dict "host" (printf "%s-prefill-hl-s%d.%s.svc.cluster.local." $fullname $s $root.Release.Namespace) "port" ($pd.prefill.httpPort | default 30001))
             "decode"  (dict "host" (printf "%s-decode-hl-s%d.%s.svc.cluster.local."  $fullname $s $root.Release.Namespace) "port" ($pd.decode.httpPort  | default 30002)))) | nindent 8 }}
        ports:
        - { containerPort: {{ $root.Values.service.port }}, name: http }
        env:
        {{- include "sglang.mergeEnv" (dict "chart" list "user" $root.Values.env "padding" 10) }}
        volumeMounts:
        - name: model-storage
          mountPath: {{ $root.Values.model.mountPath }}
          readOnly: true
        {{- with $root.Values.volumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
      - name: model-storage
        hostPath:
          path: {{ $root.Values.model.localPath }}
          type: {{ $root.Values.model.hostPathType }}
      {{- with $root.Values.volumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- /* Router scheduling: pin to THIS slice's prefill leader, on the same
             node.

             Why pin at all: the router mounts the model hostPath (hostPath is
             node-local) and only the nodes engines actually landed on are
             known to have it. Inheriting the engines' nodeAffinity would be
             both redundant (wherever prefill scheduled satisfies it by
             construction) and weaker (any allowed node, not one with the
             weights). Required podAffinity on the prefill group leader is the
             one selector that proves the model is in place -- prefill's
             model-check init ran there.

             Schedule-time only: a live router does not chase a rescheduled
             prefill, and does not need to -- the mount still serves and the
             upstreams move over cluster net. If the NODE dies the replacement
             router pod re-resolves the selector wherever prefill landed.

             The selector is the same four labels the per-slice headless
             Service uses (pd-ds.yaml); worker-index=0 because only the group
             leader serves HTTP and hosts the bootstrap port the router needs.
             startupPolicy=LeaderCreated means the leader pod always exists
             first, so this pins without deadlock. */ -}}
      {{- $raff := dict "podAffinity" (dict "requiredDuringSchedulingIgnoredDuringExecution" (list (dict
           "labelSelector" (dict "matchLabels" (dict
             "disaggregatedset.x-k8s.io/name" $fullname
             "disaggregatedset.x-k8s.io/role" "prefill"
             "disaggregatedset.x-k8s.io/slice" (printf "%d" $s)
             "leaderworkerset.sigs.k8s.io/worker-index" "0"))
           "topologyKey" "kubernetes.io/hostname"))) -}}
      {{- if not (kindIs "invalid" $pd.router.affinityReplace) }}{{ if $pd.router.affinityReplace }}{{ $raff = $pd.router.affinityReplace }}{{ end }}
      {{- end }}
      {{- with $raff }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* Tolerations: inherit the user's top-level list AND the engine
             pod's nvidia.com/gpu NoSchedule auto-add (_pod.tpl, same
             construction). Once podAffinity pins the router to a GPU node the
             toleration stops being optional -- without it the router pends
             against its own affinity. A user entry for the same key wins, so
             narrowing (tolerate one value only) still works. A null
             tolerationsReplace hands the whole block to the user. */ -}}
      {{- $rtol := default (list) $root.Values.tolerations }}
      {{- $rtolHasGpu := false }}
      {{- range $rtol }}
      {{- if eq (.key | default "") "nvidia.com/gpu" }}{{- $rtolHasGpu = true }}{{- end }}
      {{- end }}
      {{- if not $rtolHasGpu }}
      {{- $rtol = concat (list (dict "key" "nvidia.com/gpu" "operator" "Exists" "effect" "NoSchedule")) $rtol }}
      {{- end }}
      {{- if not (kindIs "invalid" $pd.router.tolerationsReplace) }}{{ if $pd.router.tolerationsReplace }}{{ $rtol = $pd.router.tolerationsReplace }}{{ end }}
      {{- end }}
      {{- with $rtol }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end -}}
