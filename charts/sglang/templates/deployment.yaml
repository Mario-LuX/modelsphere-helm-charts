{{- /*
  One node per replica. The multi-node form of this deployment -- one model
  instance spanning several nodes -- is a LeaderWorkerSet instead, rendered by
  lws.yaml when lws.enabled. The two are alternatives: a model either fits on one
  node or it does not, so exactly one of them exists in a release.
*/ -}}
{{- if not .Values.lws.enabled -}}
{{- include "sglang.shutdownBudget" . }}
{{/*
  A rollout has a budget too, at the other end of the pod's life. The
  replacement pod has progressDeadlineSeconds to reach Ready, and its
  startupProbe alone is entitled to failureThreshold x periodSeconds before it
  has to answer anything. If the deadline does not clear that, a Deployment that
  is loading a large model exactly as intended gets marked
  ProgressDeadlineExceeded -- no rollback, the old pods keep serving, but
  `kubectl rollout status` and any GitOps controller watching it report a failed
  rollout. Fail here instead, where the numbers are visible.

  Deployment-only: a LeaderWorkerSet has no progress deadline to blow.
*/}}
{{- $sp := .Values.startupProbe | default dict }}
{{- $startupBudget := add (int ($sp.initialDelaySeconds | default 0)) (mul (int ($sp.failureThreshold | default 3)) (int ($sp.periodSeconds | default 10))) }}
{{- $deadline := int (.Values.progressDeadlineSeconds | default 600) }}
{{- if le $deadline $startupBudget }}
{{- fail (printf "sglang: progressDeadlineSeconds (%d) does not clear the startupProbe budget (%d = failureThreshold %d x periodSeconds %d); the rollout would be marked ProgressDeadlineExceeded while the new pod is still legitimately loading the model. Raise it past the startup budget plus image-pull time" $deadline $startupBudget (int ($sp.failureThreshold | default 3)) (int ($sp.periodSeconds | default 10))) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "sglang.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-sglang
spec:
  {{- if not .Values.scaler.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- else }}
  # replicas is deliberately ABSENT while the LLMScaler is enabled.
  #
  # The controller writes spec.replicas on this Deployment, which makes it the
  # server-side-apply owner of that field (field manager "manager"). If the chart
  # also declared it, every `helm upgrade` would try to take ownership back and
  # fail with:
  #   conflict with "manager" using apps/v1: .spec.replicas
  # Leaving it out lets the operator own the field outright. The initial replica
  # count then comes from scaler.minReplicas on the first reconcile, not from
  # replicaCount.
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- /* rollingUpdate is only legal under type: RollingUpdate -- the API
           server rejects a Deployment carrying both. Helm deep-merges values,
           so someone setting nothing but `type: Recreate` still inherits the
           default rollingUpdate block below and would get that rejection with
           no clue where the block came from. Drop it instead: under Recreate it
           has no meaning, so there is nothing for anyone to decide. */}}
    {{- if eq (.type | default "RollingUpdate") "Recreate" }}
    {{- toYaml (omit . "rollingUpdate") | nindent 4 }}
    {{- else }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- with .Values.progressDeadlineSeconds }}
  # Checked against the startupProbe budget by the block at the top of this file.
  progressDeadlineSeconds: {{ . }}
  {{- end }}
  {{- with .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-sglang
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-sglang
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /* The pod itself lives in _pod.tpl, shared with the LWS leader and
             worker so the three cannot drift apart. */}}
      {{- include "sglang.podSpec" (dict "root" . "role" "single") | nindent 6 }}
{{- end -}}
