apiVersion: v2
name: sglang
description: A Helm chart for deploying SGLang model
type: application
version: 0.4.0
appVersion: "1.0.0"

# CART is vendored under charts/cart -- already present, so no `helm dependency
# update` is needed and `helm install ./charts/sglang` works offline. The entry
# exists only to carry the condition: without it Helm renders a vendored
# subchart unconditionally.
#
# CART belongs to exactly one model (prefix affinity only means anything within
# a single model), which is why it ships inside the chart that owns the model
# rather than being installed alongside it.
dependencies:
  - name: cart
    version: 0.1.2
    condition: cart.enabled
