apiVersion: v2
name: sglang
description: SGLang inference deployment -- single-node, multi-node (LeaderWorkerSet) or prefill/decode-disaggregated (DisaggregatedSet or merged colocate pod), with optional cache-aware routing, autoscaling and hang detection
home: https://github.com/modelsphere/helm-charts
sources:
  - https://github.com/modelsphere/helm-charts
type: application
version: 0.9.37
appVersion: "1.0.0"

# CART comes from the single chart in this repo (repository: file://../cart),
# materialised with `helm dependency build` -- CI does it before lint and
# release, and the published archive carries it, so installing the released
# chart needs no repository. The condition keeps it off when cart.enabled is
# false.
#
# CART belongs to exactly one model (prefix affinity only means anything within
# a single model), which is why it ships inside the chart that owns the model
# rather than being installed alongside it.
#
# Bump the version below together with charts/cart's own.
dependencies:
  - name: cart
    version: 0.2.4
    # The single copy in this repo, shared by both parent charts rather than
    # vendored into each of them.
    repository: "file://../cart"
    condition: cart.enabled

  # The continuation gateway sits in FRONT of this release's CART:
  #   nginx -> continuation-gateway -> CART -> engine
  # It resumes a streamed completion once if the engine stalls or drops mid-stream, and
  # like CART it belongs to the release that owns the model. Off by default
  # (enabled: true to opt in); its downstream is derived to be this release's CART
  # (see charts/continuation-gateway/values.yaml). `alias` gives the values key a
  # camelCase name -- a hyphenated one cannot be written as .Values.continuation-gateway.
  - name: continuation-gateway
    version: 0.1.4
    repository: "file://../continuation-gateway"
    alias: continuationGateway
    condition: continuationGateway.enabled
