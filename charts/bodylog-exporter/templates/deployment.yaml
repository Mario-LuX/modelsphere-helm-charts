{{- if and .Values.data.hostPath (empty .Values.nodeSelector) }}
{{- fail "\n[bodylog-exporter] data.hostPath is set but nodeSelector is empty. The detail records live on a node-local disk, so this pod must run on the same node as the listener that writes them. Pin it, e.g. --set nodeSelector.\"kubernetes\\.io/hostname\"=<node>" }}
{{- end }}
{{- /* A list of groups is understood from exporter 0.2.8 on; an older image pinned in
       image.tag would request /apis/<a>,<b>/... and lose route discovery entirely. */}}
{{- $tag := toString .Values.image.tag }}
{{- if and (contains "," .Values.routeDiscovery.apiGroup) (regexMatch "^v?[0-9]+\\.[0-9]+\\.[0-9]+$" $tag) }}
{{- if semverCompare "<0.2.8" $tag }}
{{- fail (printf "\n[bodylog-exporter] image.tag=%s reads a single group, but routeDiscovery.apiGroup=%q lists several. Use image 0.2.8 or newer, or set one group." $tag .Values.routeDiscovery.apiGroup) }}
{{- end }}
{{- end }}
{{- if empty .Values.data.hostPath }}
{{- fail "\n[bodylog-exporter] data.hostPath is empty. It must point at the node directory the listener writes to (its persistence.hostPath), otherwise there are no records to read." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bodylog-exporter.fullname" . }}
  labels: {{- include "bodylog-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy }}   # Recreate: two exporters overlapping during a rollout would be scraped as duplicate series
  selector:
    matchLabels: {{- include "bodylog-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "bodylog-exporter.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "bodylog-exporter.fullname" . }}   # lists ModelRoutes and EndpointSlices (route discovery and enrichment)
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - { name: BODYLOG_DETAILS_DIR, value: "{{ .Values.data.dir }}/metrics/details" }
            - { name: EXPORTER_LISTEN,     value: "0.0.0.0:{{ .Values.port }}" }
            - { name: CHECKPOINT_PATH,     value: "/ckpt/checkpoint.json" }
            - { name: TZ,                  value: "{{ .Values.timezone }}" }
            - { name: DATE_TZ,             value: "{{ .Values.dateTz | default .Values.timezone }}" }
            # Filling the gap left when the listener rotates a day's records: a
            # separate pod, so this goes through the Service, not localhost.
            - { name: BODYLOG_URL,         value: "http://{{ .Values.listener.service }}:{{ .Values.listener.httpPort }}" }
            - name: BODYLOG_HTTP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ include "bodylog-exporter.secretName" . }}, key: BODYLOG_HTTP_TOKEN }
            {{- if .Values.openrestyPoll.url }}
            - { name: OPENRESTY_POLL_URL,         value: "{{ .Values.openrestyPoll.url }}" }
            - { name: OPENRESTY_POLL_INTERVAL_MS, value: "{{ .Values.openrestyPoll.intervalMs }}" }
            {{- if .Values.openrestyPoll.routes }}
            - { name: OPENRESTY_POLL_ROUTES,      value: "{{ join "," .Values.openrestyPoll.routes }}" }   # static override
            {{- else if .Values.routeDiscovery.enabled }}
            # Dynamic discovery: with OPENRESTY_POLL_ROUTES unset, the exporter
            # lists ModelRoute resources to learn which routes exist.
            - { name: MODELROUTE_GROUP,                 value: "{{ .Values.routeDiscovery.apiGroup }}" }
            - { name: MODELROUTE_VERSION,               value: "{{ .Values.routeDiscovery.version }}" }
            - { name: MODELROUTE_PLURAL,                value: "{{ .Values.routeDiscovery.plural }}" }
            - { name: ROUTE_DISCOVERY_INTERVAL_SECONDS, value: "{{ .Values.routeDiscovery.intervalSeconds }}" }
            - { name: OPENRESTY_SERVICE,                value: "{{ .Values.routeDiscovery.openrestyService }}" }
            {{- end }}
            {{- end }}
          ports:
            - { name: exporter, containerPort: {{ .Values.port }} }
          {{- if .Values.probes.enabled }}
          livenessProbe:
            httpGet: { path: /healthz, port: {{ .Values.port }} }
            periodSeconds: 15
            failureThreshold: 3
          {{- end }}
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - { name: data, mountPath: {{ .Values.data.dir }}, readOnly: true }   # read-only tail: never writes, so it cannot collide with the listener
            - { name: ckpt, mountPath: /ckpt }                                     # read offset (writable)
      volumes:
        - name: data
          # Directory, not DirectoryOrCreate, on purpose: if the path is wrong the
          # pod fails to start and says so, rather than mounting a freshly created
          # empty directory and reporting no data forever.
          hostPath: { path: {{ .Values.data.hostPath | quote }}, type: Directory }
        - name: ckpt
        {{- if .Values.checkpoint.emptyDir }}
          emptyDir: {}                                                             # testing only: the offset is lost on restart, so the day is re-read
        {{- else }}
          {{- $ckpt := .Values.checkpoint.hostPath | default (printf "%s/%s-ckpt" (dir .Values.data.hostPath) (include "bodylog-exporter.fullname" .)) }}
          hostPath: { path: {{ $ckpt | quote }}, type: DirectoryOrCreate }         # on the node, beside the data directory, so upgrades do not reset counters
        {{- end }}
