---
# Source: sglang/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-mock
  namespace: vllm-mock
  labels:
    app: vllm-mock-sglang
spec:
  maxUnavailable: 1
  # AlwaysAllow lets a pod that has never been Ready be evicted even while the
  # budget is unmet. Without it (the API default, IfHealthyBudget) a fleet that
  # is already short one replica cannot be drained at all -- and on this chart
  # "not Ready" is the normal state for the ~20 minutes a large model spends
  # loading, so the window where that bites is not a corner case.
  # Requires Kubernetes >= 1.27 (>= 1.26 behind a feature gate); an older API
  # server drops the field rather than failing, leaving the default behaviour.
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      # Every engine pod of this release: the Deployment's, or -- under
      # lws.enabled -- both roles of every group. See the note above on why
      # workers are in here.
      app: vllm-mock-sglang
