# Source: sglang/templates/hang-watcher-configmap.yaml
# Thresholds for the hang-watcher sidecar, mounted at /etc/hang-watcher. The
# sidecar hot-reloads this on mtime change, so `helm upgrade` retunes it in place
# without a pod restart. Keys are the sidecar's own (snake_case); values come
# from hangWatcher.config in values.yaml.
#
# log_file is NOT here: it has to be built from the downward API (this pod's own
# name/namespace), which a ConfigMap cannot do, so it goes in as an env var on the
# sidecar instead. The two log_* keys below are only emitted when logHang is on --
# the sidecar ignores them without a log file anyway, but leaving them out keeps
# "is the fast path armed?" answerable by reading the ConfigMap alone.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kimi-k25-hang-watcher
  namespace: kimi
  labels:
    app: kimi-k25-sglang
data:
  config.json: |
    {
      "poll_interval_sec": 5,
      "stall_sec": 30,
      "metrics_timeout_sec": 10,
      "active_probe_enabled": true,
      "active_probe_path": "/health_generate",
      "active_probe_method": "GET",
      "active_probe_body": "",
      "active_probe_timeout_sec": 5,
      "log_stall_sec": 15,
      "log_window_sec": 120
    }

