# Source: sglang/templates/llmscaler.yaml
apiVersion: autoscaling.4pd.io/v1alpha1
kind: LLMScaler
metadata:
  name: kimi-k25
  namespace: kimi
spec:
  syncPeriodSeconds: 10
  targetRef:
    apiVersion: leaderworkerset.x-k8s.io/v1
    kind: LeaderWorkerSet
    name: kimi-k25
  # Emitted rather than left to the CRD default, so the CR says outright which of
  # the two signal sources is in play -- that choice is what decides whether
  # serverAddress below is a query API or a decision server.
  metricProvider: Custom
  serverAddress: "http://decision-gen.llm-scaler.svc:80"
  minReplicas: 1
  maxReplicas: 4
  # The replica count comes off the decision server at serverAddress. spec.metrics
  # is omitted rather than left in place, because the provider never reads it and
  # a stale query sitting in the CR only invites the belief that it still matters.
  customProvider:
    serviceId: "kimi-k25"
    path: "/decisions"
    # Narrows the match when the server reports this serviceId in more than one
    # namespace -- a serviceId matching several decisions is an error rather than
    # a choice. Unset in values, it is this release's own namespace rather than
    # nothing: a decision filed elsewhere in the cluster under the same id is not
    # this deployment's, so leaving the match open could only ever pick a wrong
    # one. Emitted always, so the CR says which namespace it is following.
    namespace: "kimi"
  scaleDown:
    behavior: CacheAware
    stabilizationWindowSeconds: 10
    maxStepReplicas: 2
---
# Source: sglang/templates/lws.yaml
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: kimi-k25
  namespace: kimi
  labels:
    app: kimi-k25-sglang
spec:
  # replicas is deliberately ABSENT while the LLMScaler is enabled, for the same
  # reason it is on the Deployment: the controller writes spec.replicas here (the
  # LWS exposes /scale, and scaler.targetRef points at this object), which makes
  # it the server-side-apply owner of that field. A chart that also declared it
  # would fight for ownership on every `helm upgrade`.
  #
  # The starting GROUP count therefore comes from scaler.minReplicas on the first
  # reconcile, not from lws.replicas -- and each of those groups is lws.size pods.
  startupPolicy: LeaderCreated
  networkConfig:
    subdomainPolicy: Shared
  rolloutStrategy:
    rollingUpdateConfiguration:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: kimi-k25-sglang
          # what the Service selects on -- workers run no HTTP server
          role: leader
          rdma-ib: "true"
      spec:
        
        terminationGracePeriodSeconds: 3600
        initContainers:
        # Refuse to start the engine unless the mounted model directory actually
        # holds a model. hostPathType above already rejects a missing path; this
        # covers an empty or half-copied one. Reuses the engine image so no extra
        # image has to be pulled, and takes no GPU.
        - name: model-check
          image: "harbor.4pd.io/hardcore-tech/sglang:v0.5.10.post1-gm-fix-v0.1"
          command:
            - /bin/sh
            - -c
            - |
              DIR="/model"
              if [ ! -d "$DIR" ]; then
                echo "model-check: $DIR is not a directory" >&2
                exit 1
              fi
              if [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
                echo "model-check: $DIR is empty -- is /mnt/disk0/models/Kimi-K2.5 populated on this node?" >&2
                exit 1
              fi
              if [ -z "$(find "$DIR" -maxdepth 1 -name "config.json" -print -quit)" ]; then
                echo "model-check: no config.json directly under $DIR -- looks like an incomplete model" >&2
                exit 1
              fi
              echo "model-check: $DIR looks like a model directory"
          volumeMounts:
          - name: model-storage
            mountPath: /model
            readOnly: true
        containers:
        - name: sglang
          image: "harbor.4pd.io/hardcore-tech/sglang:v0.5.10.post1-gm-fix-v0.1"
          # Shell form on purpose -- see the header of this file. `exec` keeps SGLang as
          # PID 1, which SIGTERM handling and the leader preStop below both depend on.
          #
          # ulimit -l lifts the locked-memory cap so the RDMA driver can pin its
          # buffers; without it NCCL falls back to a slower path or fails outright on an
          # IB fabric. Guarded, because a container without CAP_IPC_LOCK cannot raise it
          # and that is not a reason to refuse to start.
          #
          # Flags carrying a ${...} are left unquoted so the shell expands them; the rest
          # are single-quoted, so a value with a space in it (a JSON --*-override-args,
          # say) survives the trip through bash.
          command: ["bash", "-lc"]
          args:
            - |
              ulimit -l unlimited 2>/dev/null || true
              exec python3 -m sglang.launch_server \
                '--model-path=/model' \
                '--served-model-name=kimi-k2.5' \
                '--host=0.0.0.0' \
                '--port=8050' \
                '--enable-metrics' \
                '--nnodes=2' \
                '--node-rank=0' \
                --dist-init-addr=${LWS_LEADER_ADDRESS}:29500 \
                '--tp=8' \
                '--pp-size=2' \
                '--dist-timeout=1800' \
                '--trust-remote-code' \
                '--enable-cache-report' \
                '--stream-response-default-include-usage' \
                '--tokenizer-worker-num=4' \
                '--tool-call-parser=kimi_k2' \
                '--reasoning-parser=kimi_k2'
          env:
            # false makes /health a plain status check. Left at SGLang's own
            # default (true) it runs a real 1-token generation, sleeps at least 1s
            # and can take 20s, which no sane probe timeout survives.
            - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
              value: "false"
            # Makes SGLang skip its drain and exit as soon as SIGTERM arrives.
            #
            # Both spellings, because upstream renamed it and the two live side by side
            # across the images in use: 0.5.10 still reads SGL_FORCE_SHUTDOWN but warns
            # ("deprecated, please use SGLANG_FORCE_SHUTDOWN"), and 0.5.15 has dropped it
            # entirely -- grep the package and the string is not there, so on 0.5.15 the
            # old name alone is a no-op and this whole switch does nothing.
            - name: SGLANG_FORCE_SHUTDOWN
              value: "1"
            - name: SGL_FORCE_SHUTDOWN
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_NET_GDR_LEVEL
              value: "2"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
            - name: NVIDIA_DISABLE_REQUIRE
              value: "1"
          ports:
          - containerPort: 8050
            name: http
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          volumeMounts:
          - name: model-storage
            mountPath: /model
            readOnly: true
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /root/.cache
            name: dot-cache
          resources:
            limits:
              ephemeral-storage: 28Gi
              nvidia.com/gpu: "8"
              rdma/hca_shared: "1"
            requests:
              ephemeral-storage: 28Gi
          lifecycle:
            preStop:
              # Runs before SIGTERM, and its time counts against terminationGracePeriodSeconds.
              # Written in python3 because that is what the container already runs, so it is always there -- the SGLang image ships no curl or wget. Needs no external drain API.
              exec:
                command:
                  - python3
                  - -c
                  # Whether the hook ends by killing SGLang itself is gated per role -- a group
                  # through lws.leaderPreStopKill, since there the kill additionally has to
                  # break a collective its workers have left; a single pod through
                  # lifecycle.preStopKill. Deliberately NOT lifecycle.forceShutdown: that one
                  # asks the engine to skip its drain, which is a statement about in-flight
                  # requests, while this is about what to do when the engine does not exit at
                  # all. Wanting the fallback without giving up the drain is a legitimate
                  # combination, so they stay separate switches.
                  - |
                      import time, urllib.request, urllib.error, os, signal
                      
                      METRICS = "http://127.0.0.1:8050/metrics"
                      # What SGLang is working on right now, plus what is queued up.
                      # These names are SGLang's own -- vLLM calls them
                      # vllm:num_requests_running / vllm:num_requests_waiting.
                      BUSY = ("sglang:num_running_reqs", "sglang:num_queue_reqs")
                      # Never send this at a proxy: a cluster that injects HTTP_PROXY into pods would
                      # otherwise have us ask a proxy for the pod's OWN port, which it cannot reach --
                      # and an unreadable /metrics reads as "no server to drain" below.
                      OPEN = urllib.request.build_opener(urllib.request.ProxyHandler({})).open
                      
                      
                      def log(msg):
                          # PID 1's stdout, so this lands in `kubectl logs` beside the engine's own.
                          try:
                              with open("/proc/1/fd/1", "a") as f:
                                  f.write("[preStop] %s\n" % msg)
                          except Exception:
                              pass
                      
                      
                      def inflight():
                          """Requests still on this pod, or None if we cannot tell."""
                          try:
                              body = OPEN(METRICS, timeout=2).read().decode()
                          except Exception:
                              return None
                          total, found = 0.0, False
                          for line in body.splitlines():
                              if line.startswith(BUSY):
                                  try:
                                      total += float(line.rsplit(" ", 1)[1])
                                  except (IndexError, ValueError):
                                      return None
                                  found = True
                          # No matching series at all means the metrics we rely on are
                          # missing (--enable-metrics dropped, or renamed upstream). Report
                          # "cannot tell" rather than "idle", so a broken assumption makes
                          # the drain wait instead of silently skipping.
                          return total if found else None
                      
                      
                      # Keep serving while the cluster takes this pod out of rotation, so no new requests are sent here.
                      time.sleep(5)
                      
                      # Then wait for the requests we already accepted, stopping as soon as SGLang says it is idle.
                      # Unreadable metrics come back as None, which is never == 0, so a blip keeps us waiting rather
                      # than cutting requests off early. Staying unreadable for ~30s is different: there is no
                      # server to drain -- it never bound its port, or it has already died -- and sitting out the rest
                      # of drainSeconds would only hold the GPUs while the replacement waits for them. A live server
                      # is covered either way, because SIGTERM starts SGLang's own drain once this hook returns.
                      
                      
                      HEALTHZ = "http://127.0.0.1:9090/healthz"
                      
                      
                      def hung():
                          """True when the hang-watcher sidecar has already called this engine hung."""
                          try:
                              OPEN(HEALTHZ, timeout=2)
                              return False
                          except urllib.error.HTTPError as e:
                              return e.code == 503
                          except Exception:
                              return False        # sidecar unreachable -- say nothing, fall through to the drain
                      
                      
                      deadline = time.monotonic() + 600
                      unreadable = 0
                      while time.monotonic() < deadline:
                          # A hung engine's counters are frozen, not falling: they sit at whatever they were when it
                          # wedged and never reach 0, so this loop would burn the full drainSeconds waiting for a
                          # number that cannot move. Measured: the kubelet emitted Killing within 45s of the 503, and
                          # the container still took ~4 more minutes to restart, stuck right here.
                          #
                          # This adds no new verdict of its own -- by the time preStop runs the container is already
                          # being terminated, so the worst a wrong answer costs is one termination that did not wait
                          # for a drain. That is not the same class of mistake as deciding to kill something.
                          if hung():
                              log("hang-watcher reports hung -- counters are frozen, nothing to drain")
                              break
                          n = inflight()
                          if n == 0:
                              log("drained: nothing in flight")
                              break
                          if n is None:
                              unreadable += 1
                              if unreadable >= 15:
                                  log("metrics unreadable for ~30s -- no server to drain")
                                  break
                          else:
                              unreadable = 0
                          time.sleep(2)
                      else:
                          log("drain deadline reached after 600s, requests may still be in flight")
                      
                      # Drained (or out of time). Drive the shutdown from here rather than let the
                      # kubelet's SIGTERM find SGLang blocked in a collective its workers will never
                      # join. SIGTERM reaches PID 1 because SGLang installs a handler for it; SIGKILL
                      # never would. See the comment above this script.
                      log("SIGTERM -> PID 1")
                      os.kill(1, signal.SIGTERM)
                      
                      # If PID 1 exits, the kernel tears down the PID namespace and this hook dies with
                      # it -- so getting past this sleep means SGLang is stuck in its own drain.
                      time.sleep(20)
                      
                      log("still up after 20s -- killing PID 1's children to release its do_wait")
                      keep = (1, os.getpid(), os.getppid())
                      for entry in os.listdir("/proc"):
                          if not entry.isdigit() or int(entry) in keep:
                              continue
                          try:
                              os.kill(int(entry), signal.SIGKILL)
                          except OSError:
                              pass
          # While this is running the kubelet suppresses the other two probes, so a
          # slow model load cannot trip a restart. Its
          # failureThreshold x periodSeconds is the entire startup budget.
          #
          # Under LWS it covers more than a model load: the leader's port only binds
          # once the whole group has finished the NCCL rendezvous, so this budget has
          # to clear the slowest worker's start too.
          startupProbe:
            failureThreshold: 160
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health_generate
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
          # hang-watcher owns liveness: probe the sidecar's /healthz on the shared
          # pod network; a 503 (hang) restarts THIS container. Replaces the
          # /health_generate check -- see hangWatcher in values.yaml for why.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            failureThreshold: 2
            periodSeconds: 5
        # Hang-detection sidecar (see hangWatcher in values.yaml). Reads this pod's
        # own SGLang /metrics over localhost and serves /healthz for the engine's
        # livenessProbe above. Reports only; the kubelet does the restart. No RBAC.
        #
        # Worker pods do not get one: they run no HTTP server, so there are no metrics
        # to read -- and under RecreateGroupOnPodRestart a hung group is dealt with by
        # restarting the leader anyway, which takes the whole group with it.
        - name: hang-watcher
          image: "harbor.4pd.io/hardcore-tech/hang-watcher:0.1.18"
          env:
          - name: ENGINE_URL
            value: "http://127.0.0.1:8050"
          - name: LISTEN
            value: ":9090"
          - name: CONFIG_FILE
            value: /etc/hang-watcher/config.json
          # Log fast path. Containers in a pod do NOT share a filesystem, so "same pod"
          # is not enough to read the engine's output: its stdout goes to the NODE, at
          # /var/log/pods/<ns>_<pod>_<uid>/<container>/N.log. Hence the read-only hostPath
          # below plus these two downward-API vars -- without them the glob would also match
          # the sglang container of every OTHER pod on the node, and a neighbour's stall
          # would get this pod restarted. The uid and the rotation index stay globs.
          #
          # (The alternative -- an emptyDir shared with the engine -- would need SGLang to
          # write to a file, which it has no flag for; wrapping the command in a `tee` pipe
          # would displace PID 1 and break the SIGTERM drain this chart relies on.)
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: POD_NS
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: LOG_FILE
            value: "/var/log/pods/$(POD_NS)_$(POD_NAME)_*/sglang/*.log"
          ports:
          - containerPort: 9090
            name: hang-hz
          # Readiness on the sidecar itself: a hang verdict drops the POD out of the Service (an endpoint
          # needs every container ready), so traffic stops arriving before the kill/drain even starts.
          # The engine's own /v1/models readiness is untouched and still applies -- see values.yaml.
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9090
            failureThreshold: 2
            periodSeconds: 5
          volumeMounts:
          - name: hang-watcher-config
            mountPath: /etc/hang-watcher
            readOnly: true
          - name: pod-logs
            mountPath: /var/log/pods
            readOnly: true
          resources:
            limits:
              cpu: 100m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 16Mi
        volumes:
        - name: model-storage
          hostPath:
            path: /mnt/disk0/models/Kimi-K2.5
            type: Directory
        - name: hang-watcher-config
          configMap:
            name: kimi-k25-hang-watcher
        - name: pod-logs
          hostPath:
            path: /var/log/pods
            type: Directory
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm
        - hostPath:
            path: /root/deploy/kimi-k2.5/.cache_sglang_k8s
            type: DirectoryOrCreate
          name: dot-cache
        schedulerName: volcano
        priorityClassName: inference-prod
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H100-80GB-HBM3
                - key: nvidia.com/cuda.driver-version.full
                  operator: In
                  values:
                  - 575.57.08
        tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
    workerTemplate:
      metadata:
        labels:
          app: kimi-k25-sglang
          role: worker
          rdma-ib: "true"
      spec:
        
        terminationGracePeriodSeconds: 60
        initContainers:
        # Refuse to start the engine unless the mounted model directory actually
        # holds a model. hostPathType above already rejects a missing path; this
        # covers an empty or half-copied one. Reuses the engine image so no extra
        # image has to be pulled, and takes no GPU.
        - name: model-check
          image: "harbor.4pd.io/hardcore-tech/sglang:v0.5.10.post1-gm-fix-v0.1"
          command:
            - /bin/sh
            - -c
            - |
              DIR="/model"
              if [ ! -d "$DIR" ]; then
                echo "model-check: $DIR is not a directory" >&2
                exit 1
              fi
              if [ -z "$(ls -A "$DIR" 2>/dev/null)" ]; then
                echo "model-check: $DIR is empty -- is /mnt/disk0/models/Kimi-K2.5 populated on this node?" >&2
                exit 1
              fi
              if [ -z "$(find "$DIR" -maxdepth 1 -name "config.json" -print -quit)" ]; then
                echo "model-check: no config.json directly under $DIR -- looks like an incomplete model" >&2
                exit 1
              fi
              echo "model-check: $DIR looks like a model directory"
          volumeMounts:
          - name: model-storage
            mountPath: /model
            readOnly: true
        - name: wait-leader
          image: "harbor.4pd.io/hardcore-tech/sglang:v0.5.10.post1-gm-fix-v0.1"
          env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          command: ["bash", "-lc"]
          args:
            - |
              set -u
              leader="${LWS_LEADER_ADDRESS:-${POD_NAME%-*}.kimi-k25}"
              port=29500
              echo "wait-leader: waiting for the group leader at ${leader}:${port}"
              i=0
              until timeout 5 bash -c "exec 3<>/dev/tcp/${leader}/${port}" 2>/dev/null; do
                i=$((i + 1))
                # ~1 line a minute, so a 20-minute cold start does not bury the log
                [ $((i % 12)) -eq 1 ] && echo "wait-leader: ${leader}:${port} not accepting yet (${i} tries)"
                sleep 5
              done
              echo "wait-leader: ${leader}:${port} is up after ${i} tries -- starting the engine"
        containers:
        - name: sglang
          image: "harbor.4pd.io/hardcore-tech/sglang:v0.5.10.post1-gm-fix-v0.1"
          # Shell form on purpose -- see the header of this file. `exec` keeps SGLang as
          # PID 1, which SIGTERM handling and the leader preStop below both depend on.
          #
          # ulimit -l lifts the locked-memory cap so the RDMA driver can pin its
          # buffers; without it NCCL falls back to a slower path or fails outright on an
          # IB fabric. Guarded, because a container without CAP_IPC_LOCK cannot raise it
          # and that is not a reason to refuse to start.
          #
          # Flags carrying a ${...} are left unquoted so the shell expands them; the rest
          # are single-quoted, so a value with a space in it (a JSON --*-override-args,
          # say) survives the trip through bash.
          command: ["bash", "-lc"]
          args:
            - |
              ulimit -l unlimited 2>/dev/null || true
              exec python3 -m sglang.launch_server \
                '--model-path=/model' \
                '--served-model-name=kimi-k2.5' \
                '--host=0.0.0.0' \
                '--port=8050' \
                '--enable-metrics' \
                '--nnodes=2' \
                --node-rank=${LWS_WORKER_INDEX} \
                --dist-init-addr=${LWS_LEADER_ADDRESS}:29500 \
                '--tp=8' \
                '--pp-size=2' \
                '--dist-timeout=1800' \
                '--trust-remote-code' \
                '--enable-cache-report' \
                '--stream-response-default-include-usage' \
                '--tokenizer-worker-num=4' \
                '--tool-call-parser=kimi_k2' \
                '--reasoning-parser=kimi_k2'
          env:
            # false makes /health a plain status check. Left at SGLang's own
            # default (true) it runs a real 1-token generation, sleeps at least 1s
            # and can take 20s, which no sane probe timeout survives.
            - name: SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION
              value: "false"
            # Makes SGLang skip its drain and exit as soon as SIGTERM arrives.
            #
            # Both spellings, because upstream renamed it and the two live side by side
            # across the images in use: 0.5.10 still reads SGL_FORCE_SHUTDOWN but warns
            # ("deprecated, please use SGLANG_FORCE_SHUTDOWN"), and 0.5.15 has dropped it
            # entirely -- grep the package and the string is not there, so on 0.5.15 the
            # old name alone is a no-op and this whole switch does nothing.
            - name: SGLANG_FORCE_SHUTDOWN
              value: "1"
            - name: SGL_FORCE_SHUTDOWN
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
            - name: NCCL_IB_DISABLE
              value: "0"
            - name: NCCL_NET_GDR_LEVEL
              value: "2"
            - name: NCCL_SOCKET_IFNAME
              value: eth0
            - name: GLOO_SOCKET_IFNAME
              value: eth0
            - name: PYTORCH_ALLOC_CONF
              value: expandable_segments:True
            - name: NVIDIA_DISABLE_REQUIRE
              value: "1"
          securityContext:
            capabilities:
              add:
              - IPC_LOCK
          volumeMounts:
          - name: model-storage
            mountPath: /model
            readOnly: true
          - mountPath: /dev/shm
            name: dshm
          - mountPath: /root/.cache
            name: dot-cache
          resources:
            limits:
              ephemeral-storage: 28Gi
              nvidia.com/gpu: "8"
              rdma/hca_shared: "1"
            requests:
              ephemeral-storage: 28Gi
        volumes:
        - name: model-storage
          hostPath:
            path: /mnt/disk0/models/Kimi-K2.5
            type: Directory
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm
        - hostPath:
            path: /root/deploy/kimi-k2.5/.cache_sglang_k8s
            type: DirectoryOrCreate
          name: dot-cache
        schedulerName: volcano
        priorityClassName: inference-prod
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
              - matchExpressions:
                - key: nvidia.com/gpu.product
                  operator: In
                  values:
                  - NVIDIA-H100-80GB-HBM3
                - key: nvidia.com/cuda.driver-version.full
                  operator: In
                  values:
                  - 575.57.08
        tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
---
# Source: sglang/templates/modelroute.yaml
apiVersion: routing.gpucluster.io/v1alpha1
kind: ModelRoute
metadata:
  name: kimi-k2.5
  namespace: kimi
  labels:
    app: kimi-k25-sglang
  finalizers:
    - routing.gpucluster.io/cleanup
spec:
  # The backend bucket: what feeds CART's workers, nginx's backend peers and
  # monitor's service rows. Always this release's own Service, so a scale event
  # is all it takes for every route to follow.
  discovery:
    service: "kimi/kimi-k25-leader"
    # Emitted rather than left to autoconfig's auto-derivation: the chart already
    # knows the port, and a fixed value keeps working if a second port is ever
    # added to the Service (auto-derivation only handles the single-port case).
    port: 8050
  # Cache-aware router for THIS model, deployed by this release. CART is
  # per-model by nature -- prefix affinity is only meaningful within one model --
  # so it is never shared, and two ModelRoutes never name the same one.
  cart:
    service: "kimi/kimi-k25-cart"
    # Emitted rather than left to autoconfig's auto-derivation, for the same
    # reason as discovery.port above.
    port: 8071
    outputConfigMap: "kimi/kimi-k25-cart-config"
    maxLoad: 50
  nginx:
    route: "kimi-k2.5"
    outputConfigMap: "llm-route/openresty-conf"
    service: "llm-route/openresty"
    # Rendered verbatim into openresty's lua route table, so new tuning knobs
    # need no chart change. Quoted because the CRD types them as strings.
    values:
      default_max: "50"
      expose_routed_peer: "true"
      kimi_normalize_default_enabled: "false"
      tps_limit_tps: "30"
      ttft_limit_ms: "20000"
    # Ordered peer groups; higher priority wins, and traffic only cascades to a
    # lower tier once every peer above it is banned. A cart tier at the top is
    # added by the chart whenever the route has a CART and the list does not
    # already name one.
    peers:
      - maxConcurrencyFromBackend: true
        priority: 3
        use: cart
      - maxConcurrency: 100
        priority: 2
        use: backend
      - priority: 1
        use: backend-svc
  slo:
    name: "kimi-k25"
  monitor:
    outputConfigMap: "monitoring/monitor-conf"
    # Defaults to serviceId
    model: "kimi-k2.5"
    gpuType: "H100"
---
# Source: sglang/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kimi-k25
  namespace: kimi
  labels:
    app: kimi-k25-sglang
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: kimi-k25-sglang
  # Copy these pod labels onto the scraped series so metric queries can scope to
  # a single deployment (e.g. app="<release>-sglang") when several deployments
  # serve the same model.
  podTargetLabels:
    - app
  endpoints:
    - port: http-inference
      path: "/metrics"
      interval: "15s"
      scrapeTimeout: "10s"

