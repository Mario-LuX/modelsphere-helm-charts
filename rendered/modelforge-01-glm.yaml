# Source: sglang/charts/cart/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelforge-01-glm-cart
  namespace: modelforge-01-glm
  labels:
    helm.sh/chart: cart-0.2.0
    app.kubernetes.io/name: cart
    app.kubernetes.io/instance: modelforge-01-glm
    app.kubernetes.io/version: "v0.6.4"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cart
      app.kubernetes.io/instance: modelforge-01-glm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart
        app.kubernetes.io/instance: modelforge-01-glm
    spec:
      terminationGracePeriodSeconds: 3600   # 硬切刀:到点 SIGKILL 强砍在途流。cart 也要排空长流(SSE 转发),须按最长流式响应设,别吃 k8s 默认 30s(见 openresty chart)
      serviceAccountName: modelforge-01-glm-cart   # ha-gate 用它管 Lease
      shareProcessNamespace: true
      initContainers:
        # 等 autoconfig 把真 workers(url: http://...)写进 config.yaml 再启 cart —— CART 拒绝空 workers 会崩溃循环。
        # 停在 Init 而非 CrashLoop;workers 就绪(或 ~10min 超时兜底)后放行。用 cart 镜像自身(已在,免额外拉)。
        - name: wait-workers
          image: "harbor.4pd.io/hardcore-tech/cache_aware_router:v0.6.4"
          # 扫底稿 + 覆盖层全部文件(autoconfig 落点可能是其中任一个)。正则别收紧到 [[:space:]]*http:带引号的 url 会漏。
          command: ["sh", "-c", "for i in $(seq 1 300); do grep -qE 'url:.*http' /workspace/configs/config.yaml /workspace/configs/workers.yaml 2>/dev/null && { echo 'workers ready'; exit 0; }; echo \"[$i] 等 autoconfig 写 workers...\"; sleep 2; done; echo 'timeout, 仍放行'; exit 0"]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
      containers:
        - name: cart
          image: "harbor.4pd.io/hardcore-tech/cache_aware_router:v0.6.4"
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "ulimit -n 65535; exec ./launch_service \"$@\"", "--"]   # "$@" 透传下面的 args
          args:                         # 加载顺序 = 覆盖顺序,后者覆盖前者
            - "-c"
            - "/workspace/configs/config.yaml"
            - "-c"
            - "/workspace/configs/workers.yaml"
          ports:
            - containerPort: 8071
          volumeMounts:
            - name: cfg               # 底稿 + 各 overlay key,整卷挂到 /workspace/configs
              mountPath: /workspace/configs
          startupProbe:                 # 慢启动预算:端口起来前不判 live/ready(最多 ~60s)
            tcpSocket: { port: 8071 }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:                # startup 过后才生效 → snappy 快抓假死
            tcpSocket: { port: 8071 }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:               # startup 过后端口已在 → 秒 Ready;谁收流量由 ha-active 标签定
            tcpSocket: { port: 8071 }
            periodSeconds: 2
            failureThreshold: 2
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
            requests:
              cpu: 200m
              memory: 256Mi
        - name: reload
          image: harbor.4pd.io/hardcore-tech/autoconfig-reload:0.3.31
          args: ["--watch", "/workspace/configs", "--process", "cache-aware-router"]
          volumeMounts:
            - name: cfg
              mountPath: /workspace/configs
        - name: hagate                  # master-standby:只有 leader 给自己打 cart-active 标签 → 只有它进 Service
          image: harbor.4pd.io/hardcore-tech/autoconfig-hagate:0.3.31
          args: ["--lease", "modelforge-01-glm-cart-ha", "--http", ":8081", "--app-tcp", "127.0.0.1:8071", "--label-key", "cart-active"]
          env:
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
      volumes:
        - name: cfg
          configMap:
            name: modelforge-01-glm-cart-config   # chart 建底稿 + overlay key,autoconfig 填它那个 key
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: modelforge-01-glm
                  app.kubernetes.io/name: cart
              topologyKey: kubernetes.io/hostname
            weight: 100

