name: ci

# Lint and render every chart, on every pull request and push to main.
# check-images.yml additionally checks the images of charts whose version moves;
# publishing is release.yml.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # sglang and vllm depend on charts/cart through file://../cart: nothing is
      # downloaded, but the subchart has to be materialised before lint/template.
      - name: Resolve local chart dependencies
        run: |
          for d in charts/*/; do
            grep -q '^dependencies:' "$d/Chart.yaml" || continue
            helm dependency build --skip-refresh "$d"
          done

      # Values a chart refuses to render without -- the same ones
      # hack/check-chart-images.sh uses. They only satisfy the chart's own
      # guards; without them `helm lint` reports the guard's `fail` as INFO and
      # passes without having rendered the templates at all.
      - name: Write per-chart CI values
        run: |
          mkdir -p "$RUNNER_TEMP/values"
          for d in charts/*/; do
            c=$(basename "$d")
            case "$c" in
              sglang|vllm)      args="--set modelRoute.nginx.outputConfigMap=ci/openresty-conf" ;;
              bodylog-exporter) args="--set data.hostPath=/ci --set nodeSelector.ci=ci" ;;
              *)                args="" ;;
            esac
            echo "$args" > "$RUNNER_TEMP/values/$c"
          done

      - name: helm lint --strict
        run: |
          rc=0
          for d in charts/*/; do
            c=$(basename "$d")
            # shellcheck disable=SC2046
            helm lint --strict "$d" $(cat "$RUNNER_TEMP/values/$c") || rc=1
          done
          exit $rc

      - name: helm template (smoke render)
        run: |
          rc=0
          for d in charts/*/; do
            c=$(basename "$d")
            # shellcheck disable=SC2046
            if helm template ci "$d" $(cat "$RUNNER_TEMP/values/$c") > "$RUNNER_TEMP/$c.yaml"; then
              echo "ok    $c  ($(grep -c '^kind:' "$RUNNER_TEMP/$c.yaml") objects)"
            else
              echo "::error::$c does not render"
              rc=1
            fi
          done
          exit $rc

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: LICENSE is the Apache-2.0 text, unmodified
        run: |
          if ! grep -q "Apache License" LICENSE || ! grep -q "Version 2.0, January 2004" LICENSE; then
            echo "::error file=LICENSE::LICENSE is not the Apache-2.0 text."
            exit 1
          fi
      - name: No credentials committed
        run: |
          if git ls-files | grep -InE '(^|/)\.env$|\.kubeconfig$|\.pem$|(^|/)(id_rsa|id_ed25519)$'; then
            echo "::error::a credential file is tracked"
            exit 1
          fi
