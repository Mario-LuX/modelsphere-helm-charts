# Publishes every chart whose version changed to the Helm repository served by
# GitHub Pages at https://modelsphere.github.io/helm-charts
#
# chart-releaser packages each chart, attaches the .tgz to a GitHub Release, and
# rewrites index.yaml on the gh-pages branch. It uses the built-in GITHUB_TOKEN,
# so there is no secret to rotate.
name: release-charts

on:
  push:
    branches: [main]
    # hack/ and this file are in the list so that a change to the landing-page
    # generator actually regenerates the page.
    paths: ['charts/**', 'hack/**', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write     # create releases, push to gh-pages

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Credentials stay persisted: chart-releaser and the landing-page step
      # below push to gh-pages with them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # chart-releaser needs full history to tell what changed

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # sglang and vllm depend on charts/cart through file://../cart. That is a
      # local path, so nothing is downloaded -- but the dependency still has to be
      # materialised into charts/<parent>/charts/ before `helm package` will run.
      - name: Resolve local chart dependencies
        run: |
          for d in charts/*/; do
            grep -q '^dependencies:' "$d/Chart.yaml" 2>/dev/null || continue
            helm dependency update "$d"
          done

      - name: Lint
        run: |
          # modelRoute is on by default and needs a ConfigMap name the chart cannot
          # guess, so linting the bare defaults logs a `funcMap fail` line that reads
          # like a failure even though lint passes. This value only satisfies that
          # guard; no switch is overridden.
          for d in charts/*/; do helm lint "$d" --set modelRoute.nginx.outputConfigMap=lint/openresty-conf; done

      # The same check the pull request ran (check-images.yml), once more right before
      # publishing: a direct push to main skips the pull request, and publishing a chart
      # whose images do not exist is the thing this repository must not do.
      - name: Install crane
        run: |
          curl -sSfL https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane
          crane version

      - name: Every image a released chart asks for exists
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push compares with the commit before it; a manual run has none, so it
          # checks every chart.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            hack/check-chart-images.sh "$BEFORE"
          else
            hack/check-chart-images.sh --all
          fi

      - uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          # A chart can change without its version moving -- a comment reworded,
          # a doc fixed. Without this, cr fails the whole run trying to create a
          # release that already exists.
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # chart-releaser writes index.yaml and nothing else, so the site root would
      # be a bare 404. Rebuild the landing page from the index it just published
      # -- from the index rather than from charts/, so the page cannot advertise
      # a version that was not actually released.
      #
      # Pushing to gh-pages does not retrigger this workflow: it only runs on
      # pushes to main.
      - name: Refresh the landing page
        run: |
          set -eu
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          git fetch --depth=1 origin gh-pages
          rm -rf /tmp/pages
          git worktree add --detach /tmp/pages FETCH_HEAD
          python3 hack/render_index_html.py /tmp/pages/index.yaml /tmp/pages/index.html
          cd /tmp/pages
          git add index.html
          if git diff --cached --quiet; then
            echo "landing page already up to date"
          else
            git commit -m "docs: refresh the landing page from index.yaml"
            git push origin HEAD:gh-pages
          fi
